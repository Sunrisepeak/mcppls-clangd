name: win-crash-corpus

# Empty or invalid corpora fail: infrastructure smoke is not crash evidence.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"   # Mondays

concurrency:
  group: win-crash-corpus
  cancel-in-progress: true

jobs:
  corpus:
    runs-on: windows-2022
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Qualify reduced real inputs against the pinned Windows baseline
        run: python ci/qualify_crash_candidates.py --download-windows-baseline baseline-engine --candidates tests/crash/candidates --output candidate-baseline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-candidate-baseline
          path: candidate-baseline.json
          if-no-files-found: error
      - run: pip install ninja
      - uses: ilammy/msvc-dev-cmd@v1

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.18.0
      - uses: actions/cache@v4
        with:
          path: llvm-project
          key: llvm-tree-win32-x64-${{ hashFiles('UPSTREAM') }}-${{ hashFiles('patches/**', 'overlay/**', 'ci/scripts/apply.sh') }}

      - name: Build fork clangd with PDBs and dump capture
        shell: bash
        env:
          PLATFORM: win32-x64
          JOBS: 4
          SYMBOLS: "1"
          SCCACHE_GHA_ENABLED: "true"
          SCCACHE_IDLE_TIMEOUT: "0"
          CMAKE_EXTRA: -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
        run: ./ci/ci_build.sh

      - name: Locate debugger
        shell: pwsh
        run: |
          $cdb = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe" -ErrorAction SilentlyContinue
          if (-not $cdb) { throw "cdb is required for crash corpus evidence" } else { Write-Host "cdb: $($cdb.FullName)" }

      - name: Verify linked PDB identity and debugger symbol lookup
        shell: pwsh
        run: |
          $cdb = "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe"
          python ci/windows_symbols.py --engine build-win32-x64/bin/clangd.exe --pdb build-win32-x64/bin/clangd.pdb --readobj build-win32-x64/bin/llvm-readobj.exe --pdbutil build-win32-x64/bin/llvm-pdbutil.exe --cdb "$cdb" --output dist/symbols
          if ($LASTEXITCODE -ne 0) { throw "linked PDB verification failed" }
          Copy-Item build-win32-x64/engine-build.json dist/symbols/engine-build.json

      - name: Enable WER LocalDumps for clangd
        shell: pwsh
        run: |
          $key = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\clangd.exe"
          New-Item -Path $key -Force | Out-Null
          Set-ItemProperty -Path $key -Name DumpFolder -Value "D:\a\clangd-dumps" -Type ExpandString
          Set-ItemProperty -Path $key -Name DumpType -Value 2 -Type DWord
          Set-ItemProperty -Path $key -Name DumpCount -Value 10 -Type DWord

      - name: Replay qualified candidates against the symbol-bearing fork
        shell: bash
        run: |
          python3 tests/crash/replay.py --engine build-win32-x64/bin/clangd.exe \
            --corpus tests/crash/candidates --output candidate-fork.json

      - name: Replay corpus (fail while any entry crashes)
        shell: bash
        run: |
          python3 tests/crash/replay.py --engine "$BUILD_DIR/bin/clangd.exe" \
            --corpus tests/crash/windows --output crash-outcomes.json
        env:
          BUILD_DIR: ${{ github.workspace }}/build-win32-x64

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-crash-dumps
          path: |
            dist/symbols/**
            candidate-fork.json
            crash-outcomes.json
            /d/a/clangd-dumps/**
            D:\a\clangd-dumps\**
          if-no-files-found: ignore
