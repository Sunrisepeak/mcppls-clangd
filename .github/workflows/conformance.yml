name: conformance

# Product-level LSP protocol coverage (plan doc §4.3): the fork's clangd
# driven directly through the same request surface mcppls uses, covering the
# conformance behaviors the register rows touch.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build ccache
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-linux-x64-${{ hashFiles('UPSTREAM') }}-${{ github.sha }}
          restore-keys: |
            ccache-linux-x64-${{ hashFiles('UPSTREAM') }}-
      - uses: actions/cache@v4
        with:
          path: llvm-project
          key: llvm-tree-linux-x64-${{ hashFiles('UPSTREAM') }}-${{ hashFiles('patches/**', 'overlay/**', 'ci/scripts/apply.sh') }}

      - name: Build fork clangd
        env:
          PLATFORM: linux-x64
          JOBS: 4
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          TEST: "1"
        run: ./ci/ci_build.sh

      - name: Generate bench project
        env:
          BENCH_CLANG: ${{ github.workspace }}/build-linux-x64/bin/clang
        run: python3 tests/probes/gen_bench_project.py /tmp/bench_proj 20

      - name: LSP conformance scenarios
        run: |
          python3 tests/e2e/lsp_driver.py \
            "$BUILD_DIR/bin/clangd" "--experimental-modules-support" \
            "--compile-commands-dir=/tmp/bench_proj" \
            --project /tmp/bench_proj \
            --scenarios completion,hover,diagnostics,latency \
            --budget-ms 5000
        env:
          BUILD_DIR: ${{ github.workspace }}/build-linux-x64

      - name: Full clangd module lit suite
        working-directory: ${{ github.workspace }}/build-linux-x64
        run: |
          cmake --build . --target FileCheck not count split-file llvm-config -j 4
          ./bin/llvm-lit -sv \
            tools/clang/tools/extra/clangd/test/modules-validation-cache.test \
            tools/clang/tools/extra/clangd/test/modules-stale-lock.test \
            tools/clang/tools/extra/clangd/test/modules.test \
            tools/clang/tools/extra/clangd/test/module_dependencies.test \
            tools/clang/tools/extra/clangd/test/modules_no_cdb.test \
            tools/clang/tools/extra/clangd/test/modules_config_remove_flags.test \
            tools/clang/test/Modules/pr218152.cppm
