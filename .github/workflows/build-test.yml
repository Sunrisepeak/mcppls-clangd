name: Frozen engine thread CPU and published backend diagnostic

on:
  workflow_dispatch:
    inputs:
      bundle_artifact:
        description: Exact bundle artifact from engine run 41954537459
        required: true
        type: string
      bundle_digest:
        description: Exact artifact ZIP SHA256 without prefix
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  warm-prime:
    name: cpu-stages ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, os: ubuntu-24.04, std: '', native_artifact: 13382154243, native_digest: 'f08ce7ecce89f18d6fb0d73632b56acccbfff3f736bfae59fc02c497fea41da6' }
    defaults:
      run:
        shell: bash
    env:
      MCPP_VERSION: 2026.11.5.1
      XLINGS_VERSION: v2026.10.26.1
      XLINGS_NON_INTERACTIVE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mcpplibs/openkal-image
          ref: fda22ddd9af3c03ebd3996a385bdb0382bbf62c7
          path: diagnostic-image
      - uses: actions/checkout@v4
        with:
          repository: mcpplibs/openkal-linux
          ref: '0.24.2'
          path: diagnostic-linux
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install psutil
      - name: Warm probe accounting controls
        run: |
          python ci/test_warm_usage.py
          python ci/test_linux_usage.py
          python ci/test_warm_prime_accept.py
      - name: MSVC environment
        if: matrix.std == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Locate the mapping observer
        run: strace --version
      - name: Validate real child CPU accounting
        run: python ci/ready_role_observer.py validate --output accounting-control
      - name: Frozen input identities and archives
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_ARTIFACT: ${{ matrix.native_artifact }}
          NATIVE_DIGEST: ${{ matrix.native_digest }}
          FROZEN_PLATFORM: ${{ matrix.platform }}
          BUNDLE_ARTIFACT: ${{ inputs.bundle_artifact }}
          BUNDLE_DIGEST: ${{ inputs.bundle_digest }}
        run: |
          gh api "repos/Sunrisepeak/mcppls-clangd/actions/artifacts/$NATIVE_ARTIFACT" > native-input-artifact.json
          gh api "repos/Sunrisepeak/mcppls-clangd/actions/artifacts/$BUNDLE_ARTIFACT" > bundle-input-artifact.json
          gh api "repos/Sunrisepeak/mcppls-clangd/actions/artifacts/$NATIVE_ARTIFACT/zip" > native-input.zip
          gh api "repos/Sunrisepeak/mcppls-clangd/actions/artifacts/$BUNDLE_ARTIFACT/zip" > bundle-input.zip
          python - <<'CHECK'
          import hashlib, json, os, stat, zipfile
          from pathlib import Path
          for stem, name, digest, directory in [
              ('native', 'clangd-' + os.environ['FROZEN_PLATFORM'] + '-portable', os.environ['NATIVE_DIGEST'], 'native'),
              ('bundle', 'clangd-openkal', os.environ['BUNDLE_DIGEST'], 'part')]:
              part = json.load(open(stem + '-input-artifact.json'))
              assert part['id'] == int(os.environ['NATIVE_ARTIFACT' if stem == 'native' else 'BUNDLE_ARTIFACT'])
              assert part['name'] == name and not part['expired'] and part['size_in_bytes'] > 0
              assert part['digest'] == 'sha256:' + digest
              assert part['workflow_run']['id'] == 41954537459
              assert part['workflow_run']['head_sha'] == 'a13953808f4ec4704288adca3ae095ba858bce86'
              archive = Path(stem + '-input.zip')
              assert archive.stat().st_size == part['size_in_bytes']
              assert hashlib.file_digest(archive.open('rb'), 'sha256').hexdigest() == digest
              root = Path(directory).resolve()
              with zipfile.ZipFile(archive) as z:
                  assert z.testzip() is None
                  for entry in z.infolist():
                      assert (root / entry.filename).resolve().is_relative_to(root)
                      assert not stat.S_ISLNK(entry.external_attr >> 16)
                  z.extractall(root)
          print('Exact frozen native and bundle SHA256/ZIP inputs verified; diagnostic, not release admission.')
          CHECK
      - name: xlings (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://d2learn.org/xlings-install.ps1.txt | iex
          "$env:USERPROFILE\.xlings\subos\current\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: xlings
        if: runner.os != 'Windows'
        run: |
          curl -fsSL --retry 3 https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh | bash -s "$XLINGS_VERSION"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"
      - name: okrun, the native engine and clangd.okb
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if xlings install "mcpp@$MCPP_VERSION" -y -g; then break; fi
            [ "$attempt" = 5 ] && exit 1
            sleep 30
          done
          test "$(git -C diagnostic-image rev-parse HEAD)" = fda22ddd9af3c03ebd3996a385bdb0382bbf62c7
          # Only the small native runner is built. Neither clangd artifact is rebuilt.
          (cd diagnostic-image && mcpp build -p openkal-tools --release --toolchain llvm@23.1.3 -j 4)
          python ci/build_frozen_runner_probe.py --source diagnostic-image --output runner-variants
          python ci/build_frozen_backend_probe.py --variants runner-variants \
            --backend-source diagnostic-linux/src/process.cpp \
            --source-git-blob ebe97612560a538e42c1b96591416ec355f9e69f \
            --header-git-blob sys.h=dca81ae385c5ae17409971a4fe62e02fb49b212e \
            --output backend-variants
          echo "OKRUN=$PWD/runner-variants/baseline-okrun" >> "$GITHUB_ENV"
          native="$(find native -path '*/clangd/bin/clangd' -o -path '*/clangd/bin/clangd.exe' | head -1)"
          [ -n "$native" ] || { echo "::error::no native clangd in the portable part"; find native -maxdepth 4; exit 1; }
          # An artifact keeps no file's mode: the engine's programs are made executable again.
          chmod +x "$(dirname "$native")"/*
          echo "NATIVE=$native" >> "$GITHUB_ENV"
          mkdir okb && tar xzf part/clangd-*-openkal.tar.gz -C okb
          echo "OKB=$(ls okb/clangd-*/clangd/bin/clangd.okb)" >> "$GITHUB_ENV"
      - name: Arguments of the standard library
        run: |
          set -euo pipefail
          args=""
          case "${{ matrix.std }}" in
            mac) args="--target=arm64-apple-macos14 -isysroot $(xcrun --show-sdk-path)" ;;
            msvc)
              args="--target=x86_64-pc-windows-msvc -fms-compatibility -fms-extensions"
              IFS=';' read -ra dirs <<< "$INCLUDE"
              for d in "${dirs[@]}"; do [ -n "$d" ] && args="$args -imsvc$(cygpath -m "$d")"; done ;;
          esac
          echo "STD_ARGS=$args" >> "$GITHUB_ENV"
      - name: Resource and payload identity preflight
        run: |
          python - <<'CHECK'
          from pathlib import Path
          import hashlib, json, os, platform
          def sha(p):
              with p.open('rb') as f: return hashlib.file_digest(f, 'sha256').hexdigest()
          native=Path(os.environ['NATIVE']).resolve()
          bundle=Path(os.environ['OKB']).resolve()
          runner=Path(os.environ['OKRUN']).resolve()
          assert sha(native)=='176b8da15867a90edf3059ba4ad384920953839477df49f8e2249cce825f3c72'
          assert sha(bundle)=='72fe2ebb7558ff2bdd5dae2f1bccf65ae2357dff6bcf21d73258a2991bde0e25'
          build=json.load(open('runner-variants/verified.json'))
          assert build['baseline_reproduced_exactly'] and build['originals_unchanged']
          assert sha(runner)==next(r['sha256'] for r in build['results'] if r['label']=='baseline')
          trees={}
          for lane,binary in [('native',native),('image',bundle)]:
              root=binary.parent.parent/'lib/clang/23'
              assert root.is_dir()
              trees[lane]={str(p.relative_to(root)):sha(p) for p in sorted(root.rglob('*')) if p.is_file()}
          assert trees['native']==trees['image'] and len(trees['native'])==303
          proof={'engine_source':'a13953808f4ec4704288adca3ae095ba858bce86',
                 'frozen_producer':41954537459,'native_sha256':sha(native),'bundle_sha256':sha(bundle),
                 'runner_sha256':sha(runner),'runner_scope':'matched fresh runner from openkal-image fda22ddd with published Linux0.24.1 and compiler LLVM23.1.3; baseline objects and binary reproduced exactly; clangd bytes unchanged',
                 'resource_tree':trees['native'],'affinity':sorted(os.sched_getaffinity(0)),
                 'os':platform.platform(),
                 'cpu_models':sorted({line.split(':',1)[1].strip() for line in Path('/proc/cpuinfo').read_text().splitlines() if line.startswith('model name')}),
                 'observer_source_sha256':sha(Path('ci/ready_role_observer.py')),
                 'warm_prime_sha256':sha(Path('ci/warm_prime.py')),'qualification':False,
                 'plan':'Phases native/baseline/filtered/filtered/baseline/native, each onecoldonewarm, with SELF/THREAD CPU, faults and context counters. Filtered process.cpp and its syscall-number header match the published0.24.2 Git blobs. Fixed original304unit semantics; no added cases, LLVM rebuild or qualification.'}
          Path('role-inputs.json').write_text(json.dumps(proof,indent=2)+'\n')
          CHECK
      - name: Attribute thread CPU across the published backend change
        run: |
          python ci/frozen_phase_probe.py --output phase-control --variants runner-variants \
            --native "$NATIVE" --bundle "$OKB" --backend-variants backend-variants
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frozen-thread-stages-linux-x64
          path: |
            *-input-artifact.json
            role-inputs.json
            accounting-control/**/*.json
            backend-variants/*.json
            backend-variants/*.log
            phase-control/**/*.json
            phase-control/**/*.log
            phase-control/**/*.trace
            phase-control/**/*.stdout
            phase-control/**/*.stderr
            phase-control/**/*.gz
            runner-variants/*.json
            runner-variants/*.log
            runner-variants/*-okrun
            runner-variants/*.so
            runner-variants/candidate/*.cpp
            runner-variants/candidate/*.inc
          if-no-files-found: warn
