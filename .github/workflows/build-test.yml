name: build-test

on:
  push:
    branches: [main]
  pull_request:
  # A comparison run (ci/performance-policy.md): the native engines of the platforms named, packaged as a
  # release would package them, and the image measured against them. A push or a pull request builds one
  # native engine, linux-x64, for the series' tests; the engine is released only as the ok image.
  workflow_dispatch:
    inputs:
      platform:
        description: "Comparison: the native engines to build and measure the image against"
        required: false
        default: "all"
        type: choice
        options: [linux-x64, linux-arm64, darwin-arm64, win32-x64, all]

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.pick.outputs.build }}
      floor: ${{ steps.pick.outputs.floor }}
      compare: ${{ steps.pick.outputs.compare }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        run: python3 ci/comparison_matrix.py --event "${{ github.event_name }}" --platform "${{ github.event.inputs.platform || 'all' }}" | tee -a "$GITHUB_OUTPUT"

  # clangd as an ok image: the images, clangd.okb and where it is accepted (openkal.yml).
  openkal:
    uses: ./.github/workflows/openkal.yml

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.build) }}
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    concurrency:
      # A long Windows build must not queue newer Linux/macOS results.
      # Preserve active builds and their caches independently per platform.
      group: build-test-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}-${{ matrix.platform }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        timeout-minutes: 15
        shell: bash
        run: |
          set -e
          case "${{ matrix.platform }}" in
            linux-*)
              sudo bash ci/scripts/apt-install.sh ninja-build ccache
              ;;
            darwin-*) brew install ninja ccache ;;
            win32-*)  pip install ninja ;;
          esac

      - name: MSVC environment
        if: matrix.platform == 'win32-x64'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install the Windows compiler cache
        if: matrix.platform == 'win32-x64'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.platform }}-${{ hashFiles('UPSTREAM') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.platform }}-${{ hashFiles('UPSTREAM') }}-
            ccache-${{ matrix.platform }}-
      - name: Restore llvm tree
        uses: actions/cache@v4
        with:
          path: llvm-project
          key: llvm-tree-${{ matrix.platform }}-${{ hashFiles('UPSTREAM') }}-${{ hashFiles('patches/**', 'overlay/**', 'ci/scripts/apply.sh') }}

      - name: Build and test
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          JOBS: 4
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          TEST: "1"
          RUN_TESTS: lit-subset
          SCCACHE_GHA_ENABLED: "true"
          SCCACHE_IDLE_TIMEOUT: "0"
          CMAKE_EXTRA: ${{ matrix.platform == 'win32-x64' && '-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache' || '' }}
        run: ./ci/ci_build.sh

      - name: Real standard-library const fixes remain compilable
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        run: |
          python3 tests/e2e/const_correctness.py \
            --engine build-${{ matrix.platform }}/bin/clangd --clang-tidy build-${{ matrix.platform }}/bin/clang-tidy \
            --clang build-${{ matrix.platform }}/bin/clang --workdir "${{ runner.temp }}/const-correctness"

      - uses: actions/upload-artifact@v4
        if: always() && startsWith(matrix.platform, 'linux-')
        with:
          name: const-correctness-${{ matrix.platform }}
          path: ${{ runner.temp }}/const-correctness/result.json
          if-no-files-found: error

      - name: Module DAG compilation has shared worker and dependency bounds
        shell: bash
        run: |
          python3 tests/e2e/module_dag.py \
            --engine "build-${{ matrix.platform }}/bin/clangd" \
            --clang "build-${{ matrix.platform }}/bin/clang" \
            --workdir "build-${{ matrix.platform }}/module-dag"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: module-dag-${{ matrix.platform }}
          path: |
            build-${{ matrix.platform }}/module-dag/results.json
            build-${{ matrix.platform }}/module-dag/**/replay-result.json
          if-no-files-found: warn

      - name: Response edits preserve current module symbols
        shell: bash
        run: |
          python3 tests/e2e/module_response_inputs.py \
            --engine "build-${{ matrix.platform }}/bin/clangd" \
            --clang "build-${{ matrix.platform }}/bin/clang" \
            --workdir "${{ runner.temp }}/module-response-inputs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: module-response-inputs-${{ matrix.platform }}
          path: ${{ runner.temp }}/module-response-inputs/result.json
          if-no-files-found: warn

      - name: First module completion has semantic imported symbols
        shell: bash
        run: |
          python3 tests/e2e/module_cold_completion.py \
            --engine "build-${{ matrix.platform }}/bin/clangd" \
            --clang "build-${{ matrix.platform }}/bin/clang" \
            --workdir "${{ runner.temp }}/module-cold-completion"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: module-cold-completion-${{ matrix.platform }}
          path: ${{ runner.temp }}/module-cold-completion/result.json
          if-no-files-found: warn

      - name: Current symbols survive header and draft preamble mode changes
        shell: bash
        run: |
          python3 tests/e2e/module_preamble_mode.py \
            --engine "build-${{ matrix.platform }}/bin/clangd" \
            --clang "build-${{ matrix.platform }}/bin/clang" \
            --workdir "${{ runner.temp }}/module-preamble-mode"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: module-preamble-mode-${{ matrix.platform }}
          path: ${{ runner.temp }}/module-preamble-mode/result.json
          if-no-files-found: warn

      - name: Default Linux module worker preserves dirty headers
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        run: |
          python3 tests/e2e/module_worker_default.py \
            --engine "build-${{ matrix.platform }}/bin/clangd" \
            --clang "build-${{ matrix.platform }}/bin/clang" \
            --workdir "${{ runner.temp }}/module-worker-default" \
            --dependency-mode MMD
          python3 tests/e2e/module_worker_default.py \
            --engine "build-${{ matrix.platform }}/bin/clangd" \
            --clang "build-${{ matrix.platform }}/bin/clang" \
            --workdir "${{ runner.temp }}/module-worker-payloads" \
            --engine-flag=--modules-builder-worker-output-mib=1 \
            --engine-flag=--modules-builder-worker-capture-mib=1
          python3 tests/e2e/module_worker_failure.py \
            --engine "build-${{ matrix.platform }}/bin/clangd" \
            --clang "build-${{ matrix.platform }}/bin/clang" \
            --workdir "${{ runner.temp }}/module-worker-failure"
          python3 tests/e2e/module_worker_diagnostics.py \
            --engine "build-${{ matrix.platform }}/bin/clangd" \
            --clang "build-${{ matrix.platform }}/bin/clang" \
            --workdir "${{ runner.temp }}/module-worker-diagnostics"
      - uses: actions/upload-artifact@v4
        if: always() && startsWith(matrix.platform, 'linux-')
        with:
          name: module-worker-default-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/module-worker-default/result.json
            ${{ runner.temp }}/module-worker-payloads/result.json
            ${{ runner.temp }}/module-worker-failure/result.json
            ${{ runner.temp }}/module-worker-diagnostics/result.json
          if-no-files-found: warn

      - name: Provider command facts survive fresh module facades
        shell: bash
        run: |
          python3 tests/e2e/module_provider_cache.py \
            --engine "build-${{ matrix.platform }}/bin/clangd" \
            --clang "build-${{ matrix.platform }}/bin/clang" \
            --workdir "${{ runner.temp }}/module-provider-cache"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: module-provider-cache-${{ matrix.platform }}
          path: ${{ runner.temp }}/module-provider-cache/result.json
          if-no-files-found: warn

      - name: Verified module scans replay inputs and observe actual builtins
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        run: |
          python3 tests/e2e/module_scan_memo.py \
            --engine build-${{ matrix.platform }}/bin/clangd --clang build-${{ matrix.platform }}/bin/clang \
            --workdir "${{ runner.temp }}/module-scan-memo"
          python3 tests/e2e/module_scan_builtins.py \
            --engine build-${{ matrix.platform }}/bin/clangd --clang build-${{ matrix.platform }}/bin/clang \
            --workdir "${{ runner.temp }}/module-scan-builtins"
      - uses: actions/upload-artifact@v4
        if: always() && startsWith(matrix.platform, 'linux-')
        with:
          name: verified-module-scans-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/module-scan-memo/result.json
            ${{ runner.temp }}/module-scan-builtins/summary.json
            ${{ runner.temp }}/module-scan-builtins/case-*/result.json
          if-no-files-found: warn

      - name: BMI readers read owned generations under leases; portable copies are reclaimed
        shell: bash
        run: |
          python3 tests/e2e/module_cache_lease.py \
            --engine "build-${{ matrix.platform }}/bin/clangd" \
            --clang "build-${{ matrix.platform }}/bin/clang" \
            --workdir "${{ runner.temp }}/module-cache-lease"

      - name: Legacy Linux BMI reader lease contract
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        run: |
          python3 tests/e2e/module_cache_lease.py \
            --engine "build-${{ matrix.platform }}/bin/clangd" \
            --clang "build-${{ matrix.platform }}/bin/clang" \
            --cache-mode legacy \
            --workdir "${{ runner.temp }}/module-cache-lease-legacy"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: module-cache-lease-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/module-cache-lease/results.json
            ${{ runner.temp }}/module-cache-lease-legacy/results.json
          if-no-files-found: warn

      - name: Exact request module inputs
        shell: bash
        run: |
          python3 tests/e2e/module_request_inputs.py \
            --engine "build-${{ matrix.platform }}/bin/clangd" \
            --clang "build-${{ matrix.platform }}/bin/clang" \
            --workdir "${{ runner.temp }}/module-request-inputs"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: module-request-inputs-${{ matrix.platform }}
          path: ${{ runner.temp }}/module-request-inputs/result.json
          if-no-files-found: error

      - name: Module directive diagnostic ranges
        shell: bash
        run: |
          python3 tests/e2e/module_directive_diagnostics.py \
            --engine "build-${{ matrix.platform }}/bin/clangd" \
            --output "${{ runner.temp }}/module-directive-diagnostics.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: module-directive-diagnostics-${{ matrix.platform }}
          path: ${{ runner.temp }}/module-directive-diagnostics.json
          if-no-files-found: error

      - name: Module member semantic regression
        shell: bash
        run: |
          python3 tests/e2e/completion_quality.py \
            --engine "build-${{ matrix.platform }}/bin/clangd" \
            --clang "build-${{ matrix.platform }}/bin/clang" \
            --workdir "${{ runner.temp }}/module-quality" --async-scheduling

      - name: Unsaved module export regression
        shell: bash
        run: |
          python3 tests/e2e/completion_quality.py \
            --engine "build-${{ matrix.platform }}/bin/clangd" \
            --clang "build-${{ matrix.platform }}/bin/clang" \
            --workdir "${{ runner.temp }}/module-drafts" --unsaved-update --async-scheduling

      - name: Cyclic module dependency recovery
        shell: bash
        run: |
          python3 tests/e2e/module_cycle.py \
            --engine "build-${{ matrix.platform }}/bin/clangd" \
            --clang "build-${{ matrix.platform }}/bin/clang" \
            --workdir "${{ runner.temp }}/module-cycle"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: module-cycle-${{ matrix.platform }}
          path: ${{ runner.temp }}/module-cycle/results.json
          if-no-files-found: error

      - name: Third-party imports keep resolvable modules and the preamble
        shell: bash
        run: |
          python3 tests/e2e/third_party_import.py \
            --engine "build-${{ matrix.platform }}/bin/clangd" \
            --clang "build-${{ matrix.platform }}/bin/clang" \
            --workdir "${{ runner.temp }}/third-party-import"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: third-party-import-${{ matrix.platform }}
          path: ${{ runner.temp }}/third-party-import/results.json
          if-no-files-found: error

      - name: Document close cancels live-owner module lock wait
        shell: bash
        run: |
          python3 tests/e2e/module_lock_close.py \
            --engine "build-${{ matrix.platform }}/bin/clangd" \
            --clang "build-${{ matrix.platform }}/bin/clang" \
            --workdir "${{ runner.temp }}/module-lock-close"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: module-lock-close-${{ matrix.platform }}
          path: ${{ runner.temp }}/module-lock-close/results.json
          if-no-files-found: error

      - name: Malformed module directive recovery
        shell: bash
        run: |
          python3 tests/e2e/module_directive_recovery.py \
            --engine "build-${{ matrix.platform }}/bin/clangd" \
            --clang "build-${{ matrix.platform }}/bin/clang" \
            --workdir "${{ runner.temp }}/module-directive-recovery"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: module-directive-recovery-${{ matrix.platform }}
          path: ${{ runner.temp }}/module-directive-recovery/results.json
          if-no-files-found: error

      - name: Compiler extension semantics and actual insertion
        shell: bash
        run: |
          python3 tests/e2e/compiler_extensions.py \
            --engine "build-${{ matrix.platform }}/bin/clangd" \
            --clang "build-${{ matrix.platform }}/bin/clang" \
            --workdir "${{ runner.temp }}/compiler-extensions"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-extensions-${{ matrix.platform }}
          path: ${{ runner.temp }}/compiler-extensions/results.json
          if-no-files-found: error

      # The native engine packaged as a release would package it, for the platforms the floor
      # job does not package: what a comparison run measures the image against (warm-prime).
      - name: Package payload part
        if: "!startsWith(matrix.platform, 'linux-')"
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: ./ci/scripts/package.sh

      - uses: actions/upload-artifact@v4
        if: "!startsWith(matrix.platform, 'linux-')"
        with:
          name: clangd-${{ matrix.platform }}-portable
          path: dist/clangd-*-${{ matrix.platform }}/**
          if-no-files-found: error
          retention-days: 14

      - name: Show ccache stats
        shell: bash
        run: ccache --show-stats || true
        if: matrix.platform != 'win32-x64'

  linux-portability:
    name: Linux Ubuntu 20.04 package and runtime (${{ matrix.platform }})
    needs: setup
    if: needs.setup.outputs.floor != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.floor) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.minutes }}
    concurrency:
      group: build-test-floor-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}-${{ matrix.platform }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .ccache-floor
          key: ccache-floor-clang12${{ matrix.cache }}-${{ hashFiles('UPSTREAM', matrix.rootfs) }}-${{ github.sha }}
          restore-keys: |
            ccache-floor-clang12${{ matrix.cache }}-${{ hashFiles('UPSTREAM', matrix.rootfs) }}-
      - uses: ./.github/actions/linux-floor
        with:
          platform: ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clangd-${{ matrix.platform }}-portable
          path: |
            dist/clangd-*-${{ matrix.platform }}/**
            dist/portability-${{ matrix.platform }}.json
            build-${{ matrix.platform }}-ubuntu20/portable-module-quality/quality-results.json
            build-${{ matrix.platform }}-ubuntu20/portable-module-*/result*.json
          if-no-files-found: warn
          retention-days: 14

  # The ok image against this change's native engine in a large modules workspace (ci/warm_prime.py): four
  # alternating pairs, native then image, each a cold session and three over the cache it left, on each system
  # a comparison run names; the median over the pairs of the image's ready and processor time within 1.15 times the native
  # engine's and its page faults within twice where both build in supervised workers over the owned cache, and
  # on that path everywhere (ci/warm_prime_accept.py, ci/performance-policy.md; mcpp design 2026-11-02 part 3
  # §9.4). An invalid measurement (exit 2) is the only one this job may be rerun for.
  warm-prime:
    name: warm-prime ${{ matrix.platform }}
    needs: [setup, build, linux-portability, openkal]
    # A comparison run only. The floor job is skipped when no Linux platform is compared.
    if: >-
      always() && needs.setup.outputs.compare != '[]' && needs.build.result == 'success' &&
      needs.openkal.result == 'success' &&
      (needs.linux-portability.result == 'success' || needs.linux-portability.result == 'skipped')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.compare) }}
    defaults:
      run:
        shell: bash
    env:
      MCPP_VERSION: 2026.11.5.1
      XLINGS_VERSION: v2026.10.26.1
      XLINGS_NON_INTERACTIVE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install psutil
      - name: Warm probe accounting controls
        run: |
          python ci/test_warm_usage.py
          python ci/test_linux_usage.py
          python ci/test_warm_prime_accept.py
      - name: MSVC environment
        if: matrix.std == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/download-artifact@v4
        with:
          name: clangd-${{ matrix.platform }}-portable
          path: native
      - uses: actions/download-artifact@v4
        with:
          name: clangd-openkal
          path: part
      - name: xlings (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://d2learn.org/xlings-install.ps1.txt | iex
          "$env:USERPROFILE\.xlings\subos\current\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: xlings
        if: runner.os != 'Windows'
        run: |
          curl -fsSL --retry 3 https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh | bash -s "$XLINGS_VERSION"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"
      - name: okrun, the native engine and clangd.okb
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if xlings install "mcpp@$MCPP_VERSION" -y -g; then break; fi
            [ "$attempt" = 5 ] && exit 1
            sleep 30
          done
          # okrun of the platform the images are built over (openkal/clangd/mcpp.toml).
          bash ci/scripts/probe-platform.sh h
          arch=x86_64; case "${{ matrix.platform }}" in *arm64) arch=aarch64 ;; esac
          (cd h && mcpp build --target "$arch-openkal" > /dev/null)
          (cd h && mcpp self env --target "$arch-openkal" --format json) > tools.json
          python -c "import json; print('OKRUN=' + json.load(open('tools.json'))['data']['runner']['program'])" >> "$GITHUB_ENV"
          native="$(find native -path '*/clangd/bin/clangd' -o -path '*/clangd/bin/clangd.exe' | head -1)"
          [ -n "$native" ] || { echo "::error::no native clangd in the portable part"; find native -maxdepth 4; exit 1; }
          # An artifact keeps no file's mode: the engine's programs are made executable again.
          chmod +x "$(dirname "$native")"/*
          echo "NATIVE=$native" >> "$GITHUB_ENV"
          mkdir okb && tar xzf part/clangd-*-openkal.tar.gz -C okb
          echo "OKB=$(ls okb/clangd-*/clangd/bin/clangd.okb)" >> "$GITHUB_ENV"
      - name: Arguments of the standard library
        run: |
          set -euo pipefail
          args=""
          case "${{ matrix.std }}" in
            mac) args="--target=arm64-apple-macos14 -isysroot $(xcrun --show-sdk-path)" ;;
            msvc)
              args="--target=x86_64-pc-windows-msvc -fms-compatibility -fms-extensions"
              IFS=';' read -ra dirs <<< "$INCLUDE"
              for d in "${dirs[@]}"; do [ -n "$d" ] && args="$args -imsvc$(cygpath -m "$d")"; done ;;
          esac
          echo "STD_ARGS=$args" >> "$GITHUB_ENV"
      - name: Four alternating pairs, the native engine then clangd.okb under okrun
        run: |
          set -euo pipefail
          for k in 1 2 3 4; do
            python ci/warm_prime.py --label native-${{ matrix.platform }}-$k --workdir wp-native-$k --out native-$k-warm.json --sessions 3 --std-args="$STD_ARGS" -- "$NATIVE"
            python ci/warm_prime.py --label image-${{ matrix.platform }}-$k --workdir wp-image-$k --out image-$k-warm.json --sessions 3 --std-args="$STD_ARGS" -- "$OKRUN" "$OKB"
          done
      - name: Acceptance
        run: |
          python ci/warm_prime_accept.py --platform ${{ matrix.platform }} \
            --pair native-1-warm.json image-1-warm.json --pair native-2-warm.json image-2-warm.json \
            --pair native-3-warm.json image-3-warm.json --pair native-4-warm.json image-4-warm.json \
            --out warm-prime-${{ matrix.platform }}.json
      - name: The index shards one engine writes, the other reads
        if: ${{ !cancelled() }}
        run: python ci/shard_exchange.py --workdir shard-exchange --std-args="$STD_ARGS" --native "$NATIVE" --image "$OKRUN" "$OKB"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: warm-prime-${{ matrix.platform }}
          path: |
            *-warm.json
            warm-prime-*.json
            wp-*/session-*.log
            shard-exchange/*.log
            shard-exchange/shard-exchange.json
          if-no-files-found: warn
