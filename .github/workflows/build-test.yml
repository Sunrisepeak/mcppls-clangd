name: Frozen engine readiness accounting diagnostic

on:
  workflow_dispatch:
    inputs:
      bundle_artifact:
        description: Exact bundle artifact from engine run 41954537459
        required: true
        type: string
      bundle_digest:
        description: Exact artifact ZIP SHA256 without prefix
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  warm-prime:
    name: warm-prime ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, os: ubuntu-24.04, std: '', native_artifact: 13382154243, native_digest: 'f08ce7ecce89f18d6fb0d73632b56acccbfff3f736bfae59fc02c497fea41da6' }
    defaults:
      run:
        shell: bash
    env:
      MCPP_VERSION: 2026.11.3.1
      XLINGS_VERSION: v2026.10.26.1
      XLINGS_NON_INTERACTIVE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install psutil
      - name: Warm probe accounting controls
        run: |
          python ci/test_warm_usage.py
          python ci/test_warm_prime_accept.py
      - name: MSVC environment
        if: matrix.std == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Frozen input identities and archives
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_ARTIFACT: ${{ matrix.native_artifact }}
          NATIVE_DIGEST: ${{ matrix.native_digest }}
          FROZEN_PLATFORM: ${{ matrix.platform }}
          BUNDLE_ARTIFACT: ${{ inputs.bundle_artifact }}
          BUNDLE_DIGEST: ${{ inputs.bundle_digest }}
        run: |
          gh api "repos/Sunrisepeak/mcppls-clangd/actions/artifacts/$NATIVE_ARTIFACT" > native-input-artifact.json
          gh api "repos/Sunrisepeak/mcppls-clangd/actions/artifacts/$BUNDLE_ARTIFACT" > bundle-input-artifact.json
          gh api "repos/Sunrisepeak/mcppls-clangd/actions/artifacts/$NATIVE_ARTIFACT/zip" > native-input.zip
          gh api "repos/Sunrisepeak/mcppls-clangd/actions/artifacts/$BUNDLE_ARTIFACT/zip" > bundle-input.zip
          python - <<'CHECK'
          import hashlib, json, os, stat, zipfile
          from pathlib import Path
          for stem, name, digest, directory in [
              ('native', 'clangd-' + os.environ['FROZEN_PLATFORM'] + '-portable', os.environ['NATIVE_DIGEST'], 'native'),
              ('bundle', 'clangd-openkal', os.environ['BUNDLE_DIGEST'], 'part')]:
              part = json.load(open(stem + '-input-artifact.json'))
              assert part['id'] == int(os.environ['NATIVE_ARTIFACT' if stem == 'native' else 'BUNDLE_ARTIFACT'])
              assert part['name'] == name and not part['expired'] and part['size_in_bytes'] > 0
              assert part['digest'] == 'sha256:' + digest
              assert part['workflow_run']['id'] == 41954537459
              assert part['workflow_run']['head_sha'] == 'a13953808f4ec4704288adca3ae095ba858bce86'
              archive = Path(stem + '-input.zip')
              assert archive.stat().st_size == part['size_in_bytes']
              assert hashlib.file_digest(archive.open('rb'), 'sha256').hexdigest() == digest
              root = Path(directory).resolve()
              with zipfile.ZipFile(archive) as z:
                  assert z.testzip() is None
                  for entry in z.infolist():
                      assert (root / entry.filename).resolve().is_relative_to(root)
                      assert not stat.S_ISLNK(entry.external_attr >> 16)
                  z.extractall(root)
          print('Exact frozen native and bundle SHA256/ZIP inputs verified; diagnostic, not release admission.')
          CHECK
      - name: xlings (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://d2learn.org/xlings-install.ps1.txt | iex
          "$env:USERPROFILE\.xlings\subos\current\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: xlings
        if: runner.os != 'Windows'
        run: |
          curl -fsSL --retry 3 https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh | bash -s "$XLINGS_VERSION"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"
      - name: okrun, the native engine and clangd.okb
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if xlings install "mcpp@$MCPP_VERSION" -y -g; then break; fi
            [ "$attempt" = 5 ] && exit 1
            sleep 30
          done
          # okrun of the platform the images are built over (openkal/clangd/mcpp.toml).
          mkdir -p h/src
          printf '[package]\nname = "h"\nversion = "0.1.0"\n\n[target.%s]\nplatform = "openkal-platform@0.23.7"\n' "'cfg(os = \"openkal\")'" > h/mcpp.toml
          printf 'int main() { return 0; }\n' > h/src/main.cpp
          arch=x86_64; case "${{ matrix.platform }}" in *arm64) arch=aarch64 ;; esac
          (cd h && mcpp build --target "$arch-openkal" > /dev/null)
          (cd h && mcpp self env --target "$arch-openkal" --format json) > tools.json
          python -c "import json; print('OKRUN=' + json.load(open('tools.json'))['data']['runner']['program'])" >> "$GITHUB_ENV"
          native="$(find native -path '*/clangd/bin/clangd' -o -path '*/clangd/bin/clangd.exe' | head -1)"
          [ -n "$native" ] || { echo "::error::no native clangd in the portable part"; find native -maxdepth 4; exit 1; }
          # An artifact keeps no file's mode: the engine's programs are made executable again.
          chmod +x "$(dirname "$native")"/*
          echo "NATIVE=$native" >> "$GITHUB_ENV"
          mkdir okb && tar xzf part/clangd-*-openkal.tar.gz -C okb
          echo "OKB=$(ls okb/clangd-*/clangd/bin/clangd.okb)" >> "$GITHUB_ENV"
      - name: Arguments of the standard library
        run: |
          set -euo pipefail
          args=""
          case "${{ matrix.std }}" in
            mac) args="--target=arm64-apple-macos14 -isysroot $(xcrun --show-sdk-path)" ;;
            msvc)
              args="--target=x86_64-pc-windows-msvc -fms-compatibility -fms-extensions"
              IFS=';' read -ra dirs <<< "$INCLUDE"
              for d in "${dirs[@]}"; do [ -n "$d" ] && args="$args -imsvc$(cygpath -m "$d")"; done ;;
          esac
          echo "STD_ARGS=$args" >> "$GITHUB_ENV"
      - name: Resource and payload identity preflight
        run: |
          python - <<'CHECK'
          from pathlib import Path
          import hashlib, json, os, platform
          def sha(p):
              with p.open('rb') as f: return hashlib.file_digest(f, 'sha256').hexdigest()
          native=Path(os.environ['NATIVE']).resolve()
          bundle=Path(os.environ['OKB']).resolve()
          runner=Path(os.environ['OKRUN']).resolve()
          assert sha(native)=='176b8da15867a90edf3059ba4ad384920953839477df49f8e2249cce825f3c72'
          assert sha(bundle)=='72fe2ebb7558ff2bdd5dae2f1bccf65ae2357dff6bcf21d73258a2991bde0e25'
          trees={}
          for lane,binary in [('native',native),('image',bundle)]:
              root=binary.parent.parent/'lib/clang/23'
              assert root.is_dir()
              trees[lane]={str(p.relative_to(root)):sha(p) for p in sorted(root.rglob('*')) if p.is_file()}
          assert trees['native']==trees['image'] and len(trees['native'])==303
          proof={'engine_source':'a13953808f4ec4704288adca3ae095ba858bce86',
                 'frozen_producer':41954537459,'native_sha256':sha(native),'bundle_sha256':sha(bundle),
                 'runner_sha256':sha(runner),'runner_scope':'fresh build of public platform0.23.7 runner; identity recorded, not claimed identical to a retired historical runner',
                 'resource_tree':trees['native'],'affinity':sorted(os.sched_getaffinity(0)),
                 'os':platform.platform(),
                 'cpu_models':sorted({line.split(':',1)[1].strip() for line in Path('/proc/cpuinfo').read_text().splitlines() if line.startswith('model name')}),
                 'observer_source_sha256':sha(Path('ci/ready_role_observer.py')),
                 'warm_prime_sha256':sha(Path('ci/warm_prime.py')),'qualification':False,
                 'plan':'One original native/image cold+3warm pair, then four observed cold sessions N,I,I,N. Stop on validity failure; no added samples, no LLVM rebuild.'}
          Path('role-inputs.json').write_text(json.dumps(proof,indent=2)+'\n')
          CHECK
      - name: Actual parent and reaped-child accounting control
        run: python ci/ready_role_observer.py validate --output accounting-control
      - name: Original native cold and three warm sessions
        run: python ci/warm_prime.py --label native-linux-x64 --workdir original-native --out native-warm.json --sessions 3 -- "$NATIVE"
      - name: Original image cold and three warm sessions
        run: python ci/warm_prime.py --label image-linux-x64 --workdir original-image --out image-warm.json --sessions 3 -- "$OKRUN" "$OKB"
      - name: Record original acceptance without candidate admission
        run: |
          python - <<'CHECK'
          import json,subprocess,sys
          for lane in ['native','image']:
              data=json.load(open(lane+'-warm.json'))
              assert data['units']==304 and len(data['probes'])==3
              assert len(data['sessions'])==4 and all(s['ok'] for s in data['sessions'])
              assert data['sessions'][0]['workers']==176
          status=subprocess.run([sys.executable,'ci/warm_prime_accept.py','--platform','linux-x64',
              '--native','native-warm.json','--image','image-warm.json','--out','original-acceptance.json']).returncode
          assert status in [0,1]
          json.dump({'status':status,'diagnostic_only':True,'candidate_admission':False},open('original-acceptance-status.json','w'),indent=2)
          print('Original acceptance exit status:',status,'; this workflow only collects diagnostics.')
          CHECK
      - name: Four cold role observations in the declared order
        run: |
          python - <<'OBSERVE'
          from pathlib import Path
          import hashlib,json,os,re,subprocess,sys
          orders=['native','image','image','native']
          rows=[]
          for number,lane in enumerate(orders):
              stem='observed-'+str(number)+'-'+lane
              prefix=[os.environ['NATIVE']] if lane=='native' else [os.environ['OKRUN'],os.environ['OKB']]
              command=[sys.executable,'ci/ready_role_observer.py','observe','--output',stem+'-roles','--',
                       '--label',stem,'--workdir',stem,'--out',stem+'.json','--sessions','0','--']+prefix
              subprocess.run(command,check=True)
              report=json.load(open(stem+'.json'))
              log=Path(stem,'session-0-cold.log').read_text()
              assert 'incomplete due to errors' not in log
              assert 'Failed to auto-detect resource directory' not in log
              assert 'falling back' not in log.lower()
              stdlib=re.findall(r'Indexed c\+\+23 standard library: ([^\n]+)',log)
              assert len(stdlib)==1
              if rows: assert stdlib==rows[0]['stdlib']
              commands=[line for line in log.splitlines() if ' -resource-dir=' in line]
              assert len(commands)==3
              source_files=[Path(entry['file']) for entry in json.load(open(Path(stem,'project/compile_commands.json')))]
              source_identity={str(p.relative_to(Path(stem,'project').resolve())):hashlib.sha256(p.read_bytes()).hexdigest() for p in source_files}
              if rows: assert source_identity==rows[0]['source_identity']
              paths=sorted(Path(stem,'project/.cache/clangd/modules').rglob('*.pcm'))
              assert len(paths)==176
              rows.append({'number':number,'lane':lane,'report':report,'stdlib':stdlib,
                           'source_identity':source_identity,'actual_commands':commands,
                           'pcm_bytes':sum(p.stat().st_size for p in paths)})
              Path('role-summary.json').write_text(json.dumps({'rows':rows,'qualification':False},indent=2)+'\n')
          OBSERVE
      - name: Preserve first paired PCM inputs for offline comparison
        if: always()
        run: |
          python - <<'ARCHIVE'
          from pathlib import Path
          import tarfile
          selected=[Path('observed-0-native/project'),Path('observed-1-image/project')]
          with tarfile.open('paired-pcm-inputs.tar.gz','w:gz') as archive:
              for tree in selected:
                  if tree.is_dir(): archive.add(tree,arcname=tree.parent.name)
          ARCHIVE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frozen-readiness-accounting-linux-x64
          path: |
            *-input-artifact.json
            role-inputs.json
            accounting-control/*.json
            *-warm.json
            original-acceptance*.json
            original-*/session-*.log
            observed-*.json
            observed-*/session-*.log
            observed-*-roles/**/*.json
            observed-*-roles/**/*.gz
            role-summary.json
            paired-pcm-inputs.tar.gz
          if-no-files-found: warn
