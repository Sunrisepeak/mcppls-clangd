name: Frozen engine unit memory supervision diagnostic

on:
  workflow_dispatch:
    inputs:
      bundle_artifact:
        description: Exact bundle artifact from engine run 41954537459
        required: true
        type: string
      bundle_digest:
        description: Exact artifact ZIP SHA256 without prefix
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  warm-prime:
    name: warm-prime ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, os: ubuntu-24.04, std: '', native_artifact: 13382154243, native_digest: 'f08ce7ecce89f18d6fb0d73632b56acccbfff3f736bfae59fc02c497fea41da6' }
          - { platform: linux-arm64, os: ubuntu-24.04-arm, std: '', native_artifact: 13382059481, native_digest: '14ec34ca53d8c143128b0ddf2d997b4c30e093cd756bdfe5f57b52a3efd58448' }
    defaults:
      run:
        shell: bash
    env:
      MCPP_VERSION: 2026.11.3.1
      XLINGS_VERSION: v2026.10.26.1
      XLINGS_NON_INTERACTIVE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install psutil
      - name: Warm probe accounting controls
        run: |
          python ci/test_warm_usage.py
          python ci/test_warm_prime_accept.py
      - name: MSVC environment
        if: matrix.std == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Frozen input identities and archives
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_ARTIFACT: ${{ matrix.native_artifact }}
          NATIVE_DIGEST: ${{ matrix.native_digest }}
          FROZEN_PLATFORM: ${{ matrix.platform }}
          BUNDLE_ARTIFACT: ${{ inputs.bundle_artifact }}
          BUNDLE_DIGEST: ${{ inputs.bundle_digest }}
        run: |
          gh api "repos/Sunrisepeak/mcppls-clangd/actions/artifacts/$NATIVE_ARTIFACT" > native-input-artifact.json
          gh api "repos/Sunrisepeak/mcppls-clangd/actions/artifacts/$BUNDLE_ARTIFACT" > bundle-input-artifact.json
          gh api "repos/Sunrisepeak/mcppls-clangd/actions/artifacts/$NATIVE_ARTIFACT/zip" > native-input.zip
          gh api "repos/Sunrisepeak/mcppls-clangd/actions/artifacts/$BUNDLE_ARTIFACT/zip" > bundle-input.zip
          python - <<'CHECK'
          import hashlib, json, os, stat, zipfile
          from pathlib import Path
          for stem, name, digest, directory in [
              ('native', 'clangd-' + os.environ['FROZEN_PLATFORM'] + '-portable', os.environ['NATIVE_DIGEST'], 'native'),
              ('bundle', 'clangd-openkal', os.environ['BUNDLE_DIGEST'], 'part')]:
              part = json.load(open(stem + '-input-artifact.json'))
              assert part['id'] == int(os.environ['NATIVE_ARTIFACT' if stem == 'native' else 'BUNDLE_ARTIFACT'])
              assert part['name'] == name and not part['expired'] and part['size_in_bytes'] > 0
              assert part['digest'] == 'sha256:' + digest
              assert part['workflow_run']['id'] == 41954537459
              assert part['workflow_run']['head_sha'] == 'a13953808f4ec4704288adca3ae095ba858bce86'
              archive = Path(stem + '-input.zip')
              assert archive.stat().st_size == part['size_in_bytes']
              assert hashlib.file_digest(archive.open('rb'), 'sha256').hexdigest() == digest
              root = Path(directory).resolve()
              with zipfile.ZipFile(archive) as z:
                  assert z.testzip() is None
                  for entry in z.infolist():
                      assert (root / entry.filename).resolve().is_relative_to(root)
                      assert not stat.S_ISLNK(entry.external_attr >> 16)
                  z.extractall(root)
          print('Exact frozen native and bundle SHA256/ZIP inputs verified; diagnostic, not release admission.')
          CHECK
      - name: xlings (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://d2learn.org/xlings-install.ps1.txt | iex
          "$env:USERPROFILE\.xlings\subos\current\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: xlings
        if: runner.os != 'Windows'
        run: |
          curl -fsSL --retry 3 https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh | bash -s "$XLINGS_VERSION"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"
      - name: okrun, the native engine and clangd.okb
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if xlings install "mcpp@$MCPP_VERSION" -y -g; then break; fi
            [ "$attempt" = 5 ] && exit 1
            sleep 30
          done
          # okrun of the platform the images are built over (openkal/clangd/mcpp.toml).
          mkdir -p h/src
          printf '[package]\nname = "h"\nversion = "0.1.0"\n\n[target.%s]\nplatform = "openkal-platform@0.23.7"\n' "'cfg(os = \"openkal\")'" > h/mcpp.toml
          printf 'int main() { return 0; }\n' > h/src/main.cpp
          arch=x86_64; case "${{ matrix.platform }}" in *arm64) arch=aarch64 ;; esac
          (cd h && mcpp build --target "$arch-openkal" > /dev/null)
          (cd h && mcpp self env --target "$arch-openkal" --format json) > tools.json
          python -c "import json; print('OKRUN=' + json.load(open('tools.json'))['data']['runner']['program'])" >> "$GITHUB_ENV"
          native="$(find native -path '*/clangd/bin/clangd' -o -path '*/clangd/bin/clangd.exe' | head -1)"
          [ -n "$native" ] || { echo "::error::no native clangd in the portable part"; find native -maxdepth 4; exit 1; }
          # An artifact keeps no file's mode: the engine's programs are made executable again.
          chmod +x "$(dirname "$native")"/*
          echo "NATIVE=$native" >> "$GITHUB_ENV"
          mkdir okb && tar xzf part/clangd-*-openkal.tar.gz -C okb
          echo "OKB=$(ls okb/clangd-*/clangd/bin/clangd.okb)" >> "$GITHUB_ENV"
      - name: Arguments of the standard library
        run: |
          set -euo pipefail
          args=""
          case "${{ matrix.std }}" in
            mac) args="--target=arm64-apple-macos14 -isysroot $(xcrun --show-sdk-path)" ;;
            msvc)
              args="--target=x86_64-pc-windows-msvc -fms-compatibility -fms-extensions"
              IFS=';' read -ra dirs <<< "$INCLUDE"
              for d in "${dirs[@]}"; do [ -n "$d" ] && args="$args -imsvc$(cygpath -m "$d")"; done ;;
          esac
          echo "STD_ARGS=$args" >> "$GITHUB_ENV"
      - name: Candidate Linux backend
        uses: actions/checkout@v4
        with:
          repository: mcpplibs/openkal-linux
          ref: 6bd65128c53d1bc1fc99f2ddcb984e12325b3490
          fetch-depth: 0
          path: candidate-linux
          persist-credentials: false
      - name: Published runner source
        uses: actions/checkout@v4
        with:
          repository: mcpplibs/openkal-image
          ref: fda22ddd9af3c03ebd3996a385bdb0382bbf62c7
          path: runner-source
          persist-credentials: false
      - name: Build matching baseline and filtered runners
        run: |
          python - <<'BUILD'
          from pathlib import Path
          import hashlib, io, json, os, shutil, subprocess, tarfile
          root = Path('runner-probe').resolve()
          root.mkdir()
          linux = Path('candidate-linux').resolve()
          assert subprocess.check_output(['git', '-C', str(linux), 'rev-parse', 'HEAD'], text=True).strip() == '6bd65128c53d1bc1fc99f2ddcb984e12325b3490'
          base = root / 'linux-baseline'
          base.mkdir()
          archive = subprocess.check_output(['git', '-C', str(linux), 'archive', '81cab910c9a4717afbaad228fcd1736dad85e960'])
          with tarfile.open(fileobj=io.BytesIO(archive)) as t:
              t.extractall(base, filter='data')
          source = Path('runner-source').resolve()
          assert subprocess.check_output(['git', '-C', str(source), 'rev-parse', 'HEAD'], text=True).strip() == 'fda22ddd9af3c03ebd3996a385bdb0382bbf62c7'
          proof = {'linux_base': '81cab910c9a4717afbaad228fcd1736dad85e960', 'linux_candidate': '6bd65128c53d1bc1fc99f2ddcb984e12325b3490', 'runner_source': 'fda22ddd9af3c03ebd3996a385bdb0382bbf62c7', 'compiler': subprocess.check_output(['mcpp', '--version'], text=True).strip(), 'runners': [], 'public_runner': {'path': os.environ['OKRUN'], 'sha256': hashlib.file_digest(Path(os.environ['OKRUN']).open('rb'), 'sha256').hexdigest()}}
          for label, backend in [('baseline', base), ('filtered', linux)]:
              tree = root / label
              shutil.copytree(source, tree, ignore=shutil.ignore_patterns('.git', '.xlings', '.xlings.json', 'target', '.mcpp', 'mcpp.lock'))
              manifest = tree / 'run/mcpp.toml'
              text = manifest.read_text()
              assert text.count('openkal-linux = "0.24.1"') == 1
              manifest.write_text(text.replace('openkal-linux = "0.24.1"', 'openkal-linux = { path = ' + json.dumps(str(backend)) + ' }'))
              command = ['mcpp', 'build', '-p', 'openkal-tools', '--release', '--toolchain', 'llvm@23.1.3', '-j', '4']
              subprocess.run(command, cwd=tree, check=True)
              binaries = list((tree / 'target').rglob('okrun'))
              binaries = [x for x in binaries if x.is_file() and '/bin/' in str(x)]
              assert len(binaries) == 1, binaries
              binary = binaries[0].resolve()
              sha = hashlib.file_digest(binary.open('rb'), 'sha256').hexdigest()
              proof['runners'].append({'label': label, 'path': str(binary), 'sha256': sha, 'bytes': binary.stat().st_size, 'command': command, 'source_sha256': {str(x.relative_to(backend)): hashlib.file_digest(x.open('rb'), 'sha256').hexdigest() for x in (backend / 'src/process.cpp', backend / 'src/sys.h')}})
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  print('OKRUN_' + label.upper() + '=' + str(binary), file=f)
          Path('runner-inputs.json').write_text(json.dumps(proof, indent=2) + '\n')
          BUILD
      - name: The native engine
        run: python ci/warm_prime.py --label native-${{ matrix.platform }} --workdir wp-native --out native-warm.json --sessions 3 --std-args="$STD_ARGS" -- "$NATIVE"
      - name: clangd.okb under okrun
        run: python ci/warm_prime.py --label image-${{ matrix.platform }} --workdir wp-image --out image-warm.json --sessions 3 --std-args="$STD_ARGS" -- "$OKRUN" "$OKB"
      - name: Same-compiler baseline runner
        run: python ci/warm_prime.py --label baseline-${{ matrix.platform }} --workdir wp-baseline --out baseline-warm.json --sessions 3 --std-args="$STD_ARGS" -- "$OKRUN_BASELINE" "$OKB"
      - name: Filtered unit observer runner
        run: python ci/warm_prime.py --label filtered-${{ matrix.platform }} --workdir wp-filtered --out filtered-warm.json --sessions 3 --std-args="$STD_ARGS" -- "$OKRUN_FILTERED" "$OKB"
      - name: Unchanged acceptance for every runner
        run: |
          python - <<'ACCEPT'
          import json, os, subprocess, sys
          platform = os.environ['DIAGNOSTIC_PLATFORM']
          statuses = {}
          for label, report in [('public', 'image-warm.json'), ('baseline', 'baseline-warm.json'), ('filtered', 'filtered-warm.json')]:
              command = [sys.executable, 'ci/warm_prime_accept.py', '--platform', platform, '--native', 'native-warm.json', '--image', report, '--out', 'warm-prime-' + label + '-' + platform + '.json']
              statuses[label] = subprocess.run(command).returncode
          print(json.dumps(statuses, sort_keys=True))
          # A passing diagnostic remains source-dependent evidence. It cannot
          # qualify the original producer cohort or promote the patch ledger.
          sys.exit(statuses['filtered'])
          ACCEPT
        env:
          DIAGNOSTIC_PLATFORM: ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: warm-prime-${{ matrix.platform }}
          path: |
            *-input-artifact.json
            runner-inputs.json
            *-warm.json
            warm-prime-*.json
            wp-*/session-*.log
          if-no-files-found: warn
