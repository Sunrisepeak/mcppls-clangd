name: build-test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform matrix when `all`, else single platform"
        required: false
        default: "linux-x64"
        type: choice
        options: [linux-x64, linux-arm64, darwin-arm64, win32-x64, all]

concurrency:
  group: build-test-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}-${{ github.event.inputs.platform || 'default' }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ github.event.inputs.platform }}" = "all" ]; then
            echo 'matrix=[{"platform":"linux-x64","os":"ubuntu-22.04"},{"platform":"linux-arm64","os":"ubuntu-22.04-arm"},{"platform":"darwin-arm64","os":"macos-14"},{"platform":"win32-x64","os":"windows-2022"}]' >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ github.event.inputs.platform }}" in
              linux-x64)   echo 'matrix=[{"platform":"linux-x64","os":"ubuntu-22.04"}]' >> "$GITHUB_OUTPUT" ;;
              linux-arm64) echo 'matrix=[{"platform":"linux-arm64","os":"ubuntu-22.04-arm"}]' >> "$GITHUB_OUTPUT" ;;
              darwin-arm64) echo 'matrix=[{"platform":"darwin-arm64","os":"macos-14"}]' >> "$GITHUB_OUTPUT" ;;
              win32-x64)   echo 'matrix=[{"platform":"win32-x64","os":"windows-2022"}]' >> "$GITHUB_OUTPUT" ;;
            esac
          else
            echo 'matrix=[{"platform":"linux-x64","os":"ubuntu-22.04"}]' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        shell: bash
        run: |
          set -e
          case "${{ matrix.platform }}" in
            linux-*)  sudo apt-get update && sudo apt-get install -y ninja-build ccache ;;
            darwin-*) brew install ninja ccache ;;
            win32-*)  pip install ninja ;;
          esac

      - name: MSVC environment
        if: matrix.platform == 'win32-x64'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.platform }}-${{ hashFiles('UPSTREAM') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.platform }}-${{ hashFiles('UPSTREAM') }}-
            ccache-${{ matrix.platform }}-
      - name: Restore llvm tree
        uses: actions/cache@v4
        with:
          path: llvm-project
          key: llvm-tree-${{ matrix.platform }}-${{ hashFiles('UPSTREAM') }}-${{ hashFiles('patches/**', 'overlay/**', 'ci/scripts/apply.sh') }}

      - name: Build and test
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          JOBS: 4
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          TEST: "1"
          RUN_TESTS: lit-subset
        run: ./ci/ci_build.sh

      - name: Module member semantic regression
        shell: bash
        run: |
          python3 tests/e2e/completion_quality.py \
            --engine "build-${{ matrix.platform }}/bin/clangd" \
            --clang "build-${{ matrix.platform }}/bin/clang" \
            --workdir "${{ runner.temp }}/module-quality"

      - name: Unsaved module export regression
        shell: bash
        run: |
          python3 tests/e2e/completion_quality.py \
            --engine "build-${{ matrix.platform }}/bin/clangd" \
            --clang "build-${{ matrix.platform }}/bin/clang" \
            --workdir "${{ runner.temp }}/module-drafts" --unsaved-update

      - name: Show ccache stats
        shell: bash
        run: ccache --show-stats || true
        if: matrix.platform != 'win32-x64'
