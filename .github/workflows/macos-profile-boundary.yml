name: macos-profile-boundary
on:
  push:
    branches: [ci/macos-profile-boundary]
permissions:
  contents: read
jobs:
  review:
    name: released macOS confinement profile capacity
    runs-on: macos-15
    timeout-minutes: 25
    env:
      XLINGS_NON_INTERACTIVE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned package client
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh | bash -s v2026.10.26.1
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"
      - name: Released compiler and ordinary public dependencies
        run: |
          set -euo pipefail
          xlings install mcpp@2026.11.3.1 -y -g
          mcpp self config --mirror GLOBAL
          mcpp toolchain install llvm 23.1.3
          mcpp toolchain default llvm@23.1.3
          mcpp --version | tee compiler-version.txt
          mcpp index update
      - name: Exercise actual profile limits and positive controls
        working-directory: ci/macos-profile-boundary
        run: |
          set -euo pipefail
          mcpp run --target aarch64-macos --toolchain llvm@23.1.3 2>&1 | tee observation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-confinement-profile-boundary
          path: |
            compiler-version.txt
            ci/macos-profile-boundary/mcpp.toml
            ci/macos-profile-boundary/mcpp.lock
            ci/macos-profile-boundary/src/main.cpp
            ci/macos-profile-boundary/observation.log
          retention-days: 14
