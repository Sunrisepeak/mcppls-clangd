name: macos-profile-boundary
on:
  push:
    branches: [ci/macos-profile-boundary]
permissions:
  contents: read
jobs:
  review:
    name: released macOS confinement profile capacity
    runs-on: macos-15
    timeout-minutes: 25
    env:
      XLINGS_NON_INTERACTIVE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned package client
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh | bash -s v2026.10.26.1
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"
      - name: Released compiler and ordinary public dependencies
        run: |
          set -euo pipefail
          xlings install mcpp@2026.11.3.1 -y -g
          mcpp self config --mirror GLOBAL
          mcpp toolchain install llvm 23.1.3
          mcpp toolchain default llvm@23.1.3
          mcpp --version | tee compiler-version.txt
          mcpp index update
      - name: Host runtime filesystem control
        run: |
          set -euo pipefail
          mkdir -p observations
          clang++ -std=c++20 ci/filesystem_cleanup_review.cpp -o "$RUNNER_TEMP/cleanup-native"
          "$RUNNER_TEMP/cleanup-native" "$RUNNER_TEMP/mcpp-885-cleanup-native" | tee observations/native-cleanup.log
          grep -q 'review_complete=1' observations/native-cleanup.log
      - name: Same-host published old and new group observations
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cleanup-consumer/src"
          cp ci/filesystem_cleanup_review.cpp "$RUNNER_TEMP/cleanup-consumer/src/main.cpp"
          printf '[package]\nname = "filesystem-cleanup-review"\nversion = "0.1.0"\n' > "$RUNNER_TEMP/cleanup-consumer/mcpp.toml"
          for group in 0.23.4 0.23.5; do
            set +e
            (cd ci/macos-profile-boundary && mcpp run --target aarch64-macos --toolchain llvm@23.1.3 --platform "openkal-platform@$group") \
              > "observations/$group-profile.log" 2>&1
            observed=$?
            set -e
            printf '%s\n' "$observed" > "observations/$group-profile-exit.txt"
            cp ci/macos-profile-boundary/mcpp.lock "observations/$group-profile.lock"
            (cd "$RUNNER_TEMP/cleanup-consumer" && mcpp run --target aarch64-macos --toolchain llvm@23.1.3 \
              --platform "openkal-platform@$group" -- "$RUNNER_TEMP/mcpp-885-cleanup-$group") \
              > "observations/$group-cleanup.log" 2>&1
            grep -q 'review_complete=1' "observations/$group-cleanup.log"
            cp "$RUNNER_TEMP/cleanup-consumer/mcpp.lock" "observations/$group-cleanup.lock"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          for group in ('0.23.4','0.23.5'):
              log=Path('observations',group+'-profile.log').read_text()
              rows=[json.loads(line) for line in log.splitlines() if line.startswith('{"case":')]
              assert len(rows)==6, 'All six original profile controls must actually execute'
          PY
      - name: Retain native filesystem leftovers and clean owned trees
        if: always()
        run: |
          python3 - <<'PY'
          import os,json,shutil
          from pathlib import Path
          paths=set(Path(os.environ['RUNNER_TEMP']).glob('mcpp-885-cleanup-*'))
          paths.update(Path(os.environ.get('TMPDIR','/tmp')).glob('mcpp-885-profile-*'))
          observations=[]
          for root in sorted(paths):
              count=sum(len(dirs)+len(files) for _,dirs,files in os.walk(root))
              observations.append(dict(root=str(root),remaining_entries=count))
              shutil.rmtree(root)
          Path('observations').mkdir(exist_ok=True)
          Path('observations/native-leftovers.json').write_text(json.dumps(observations,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-confinement-profile-boundary
          path: |
            compiler-version.txt
            ci/macos-profile-boundary/mcpp.toml
            ci/macos-profile-boundary/mcpp.lock
            ci/macos-profile-boundary/src/main.cpp
            ci/filesystem_cleanup_review.cpp
            observations/
          retention-days: 14
