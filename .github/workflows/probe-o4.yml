name: probe-o4

# [temp][do not merge] mcpp #885 closeout plan, O4: the published 0.0.20 engine
# (native linux-x64 and clangd.okb under okrun), cold sessions only, each read with
# measurement version 3 and with the version-2 reading immediately before and after.
# Prints and never asserts.

on:
  pull_request:

permissions:
  contents: read

jobs:
  cold-pairs:
    name: cold pairs rep ${{ matrix.rep }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2, 3]
    defaults:
      run:
        shell: bash
    env:
      MCPP_VERSION: 2026.11.5.1
      XLINGS_VERSION: v2026.10.26.1
      XLINGS_NON_INTERACTIVE: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install psutil
      - name: The published 0.0.20 engine
        run: |
          set -euo pipefail
          gh release download v0.0.20 -R Sunrisepeak/mcppls-clangd -D rel \
            -p 'clangd-23.1.0-mcppls.9-linux-x64.tar.gz*' -p 'clangd-23.1.0-mcppls.9-openkal.tar.gz*'
          (cd rel && sha256sum -c ./*.sha256)
          mkdir native okb
          tar xzf rel/clangd-23.1.0-mcppls.9-linux-x64.tar.gz -C native
          tar xzf rel/clangd-23.1.0-mcppls.9-openkal.tar.gz -C okb
          native="$(find native -path '*/clangd/bin/clangd' | head -1)"
          chmod +x "$(dirname "$native")"/*
          echo "NATIVE=$native" >> "$GITHUB_ENV"
          echo "OKB=$(ls okb/clangd-*/clangd/bin/clangd.okb)" >> "$GITHUB_ENV"
          sha256sum "$native" "$(ls okb/clangd-*/clangd/bin/clangd.okb)"
      - name: xlings
        run: |
          curl -fsSL --retry 3 https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh | bash -s "$XLINGS_VERSION"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"
      - name: okrun of platform 0.24.0
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if xlings install "mcpp@$MCPP_VERSION" -y -g; then break; fi
            [ "$attempt" = 5 ] && exit 1
            sleep 30
          done
          mkdir -p h/src
          printf '[package]\nname = "h"\nversion = "0.1.0"\n\n[target.%s]\nplatform = "openkal-platform@0.24.0"\n' "'cfg(os = \"openkal\")'" > h/mcpp.toml
          printf 'int main() { return 0; }\n' > h/src/main.cpp
          (cd h && mcpp build --target x86_64-openkal > /dev/null)
          (cd h && mcpp self env --target x86_64-openkal --format json) > tools.json
          python -c "import json; print('OKRUN=' + json.load(open('tools.json'))['data']['runner']['program'])" >> "$GITHUB_ENV"
      - name: Four interleaved cold pairs
        run: |
          set -uo pipefail
          for i in 1 2 3 4; do
            python ci/warm_prime_v2v3.py --label native --workdir "wp-n$i" --out "n$i.json" --sessions 0 -- "$NATIVE"
            python ci/warm_prime_v2v3.py --label image --workdir "wp-i$i" --out "i$i.json" --sessions 0 -- "$OKRUN" "$OKB"
          done
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          print('| pair | native v3 | native v2 (before/after) | image v3 | image v2 (before/after) | ratio v3 | ratio v2 (after) |')
          print('|---|---|---|---|---|---|---|')
          for i in range(1, 5):
              n = json.load(open(f'n{i}.json'))['sessions'][0]; m = json.load(open(f'i{i}.json'))['sessions'][0]
              r3 = m['cpu_seconds'] / n['cpu_seconds'] if n['cpu_seconds'] and m['cpu_seconds'] else None
              r2 = m['cpu_v2_after'] / n['cpu_v2_after'] if n['cpu_v2_after'] and m['cpu_v2_after'] else None
              print(f"| {i} | {n['cpu_seconds']} | {n['cpu_v2_before']}/{n['cpu_v2_after']} | {m['cpu_seconds']} | "
                    f"{m['cpu_v2_before']}/{m['cpu_v2_after']} | {r3 and round(r3, 3)} | {r2 and round(r2, 3)} |")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-o4-rep-${{ matrix.rep }}
          path: |
            n*.json
            i*.json
          retention-days: 14
