name: win-symbols

# Windows build with debug information (plan doc §4.1, §6): the artifact
# channel for the UP-12/13/20 stack hunt, mirroring how clangd/clangd ships
# its own debug-symbols artifact.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"   # Mondays

concurrency:
  group: win-symbols
  cancel-in-progress: true

jobs:
  symbols:
    runs-on: windows-2022
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ninja
      - uses: ilammy/msvc-dev-cmd@v1

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.18.0
      - uses: actions/cache@v4
        with:
          path: llvm-project
          key: llvm-tree-win32-x64-${{ hashFiles('UPSTREAM') }}-${{ hashFiles('patches/**', 'overlay/**', 'ci/scripts/apply.sh') }}

      - name: Build clangd (with PDBs)
        shell: bash
        env:
          PLATFORM: win32-x64
          JOBS: 4
          SYMBOLS: "1"
          SCCACHE_GHA_ENABLED: "true"
          SCCACHE_IDLE_TIMEOUT: "0"
          CMAKE_EXTRA: -DLLVM_ENABLE_PDB=ON -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
        run: ./ci/ci_build.sh

      - name: Verify linked PDB identity and debugger symbol lookup
        shell: pwsh
        run: |
          $cdb = "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe"
          if (-not (Test-Path $cdb)) { throw "cdb is required for symbol evidence" }
          python ci/windows_symbols.py --engine build-win32-x64/bin/clangd.exe --pdb build-win32-x64/bin/clangd.pdb --readobj build-win32-x64/bin/llvm-readobj.exe --pdbutil build-win32-x64/bin/llvm-pdbutil.exe --cdb "$cdb" --output dist/symbols
          if ($LASTEXITCODE -ne 0) { throw "linked PDB verification failed" }
          Copy-Item build-win32-x64/engine-build.json dist/symbols/engine-build.json

      - uses: actions/upload-artifact@v4
        with:
          name: clangd-debug-symbols-win32-x64
          path: dist/symbols
          if-no-files-found: error
