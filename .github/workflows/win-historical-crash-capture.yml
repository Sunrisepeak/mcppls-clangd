name: win-historical-crash-capture

# Native Windows diagnostic using already-built candidate artifacts.
on:
  workflow_dispatch:

concurrency:
  group: openkal-windows-startup-diagnostic
  cancel-in-progress: false

jobs:
  capture:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Locate native debugger and LLVM symbol readers
        shell: pwsh
        run: |
          $cdb = "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe"
          if (-not (Test-Path $cdb)) {
            # Add only the debugger feature using the signed, cached SDK installer.
            $sdk = Get-ItemProperty HKLM:\Software\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\* |
              Where-Object { $_.DisplayName -match "Windows Software Development Kit" } |
              Sort-Object DisplayVersion -Descending | Select-Object -First 1
            if (-not $sdk.BundleCachePath) { throw "No cached Windows SDK installer for CDB" }
            $signature = Get-AuthenticodeSignature $sdk.BundleCachePath
            if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notmatch "Microsoft Corporation") {
              throw "Windows SDK installer signature is not valid Microsoft code"
            }
            $installation = Start-Process -FilePath $sdk.BundleCachePath `
              -ArgumentList "/features", "OptionId.WindowsDesktopDebuggers", "/q", "/norestart" -Wait -PassThru
            if ($installation.ExitCode -notin @(0, 3010)) { throw "SDK debugger install failed: $($installation.ExitCode)" }
          }
          $readobj = "C:\Program Files\LLVM\bin\llvm-readobj.exe"
          $pdbutil = "C:\Program Files\LLVM\bin\llvm-pdbutil.exe"
          $sevenzip = "C:\Program Files\7-Zip\7z.exe"
          foreach ($tool in @($cdb, $readobj, $pdbutil, $sevenzip)) {
            if (-not (Test-Path $tool)) { throw "Required native capture tool missing: $tool" }
          }
          "CDB=$cdb" >> $env:GITHUB_ENV
          "READOBJ=$readobj" >> $env:GITHUB_ENV
          "PDBUTIL=$pdbutil" >> $env:GITHUB_ENV
          "SEVENZIP=$sevenzip" >> $env:GITHUB_ENV
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install released build client
        shell: pwsh
        run: |
          irm https://d2learn.org/xlings-install.ps1.txt | iex
          "$env:USERPROFILE\.xlings\subos\current\bin" >> $env:GITHUB_PATH
      - name: Resolve the current released runner and candidate images
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          xlings --version
          xlings update
          xlings install mcpp@2026.11.3.1 -y -g
          mcpp --version
          mkdir -p h/src
          cat > h/mcpp.toml <<'TOML'
          [package]
          name = "h"
          version = "0.1.0"
          [target.'cfg(os = "openkal")']
          platform = "openkal-platform@0.23.3"
          TOML
          printf 'int main() { return 0; }\n' > h/src/main.cpp
          (cd h && mcpp build --target x86_64-openkal)
          # Candidate proof only: build the reviewed loader correction with
          # the released client and unchanged published platform dependencies.
          git clone --depth 1 --branch fix/partial-map-copy https://github.com/mcpplibs/openkal-image.git runner-fix
          test "$(git -C runner-fix rev-parse HEAD)" = 80a48ec331976c98aa5f1bc3ccd9badc3c08eb60
          (cd runner-fix/tools && mcpp build --release --toolchain llvm@23.1.3)
          okrun="$(find "$PWD/runner-fix/target" -type f -name okrun.exe | head -1)"
          test -f "$okrun"
          echo "RUNNER_SOURCE_HEAD=80a48ec331976c98aa5f1bc3ccd9badc3c08eb60" >> "$GITHUB_ENV"
          echo "OKRUN=$(cygpath -m "$okrun")" >> "$GITHUB_ENV"
          gh run download 41674777291 -R Sunrisepeak/mcppls-clangd -n clangd-openkal -D part
          gh run download 41674777291 -R Sunrisepeak/mcppls-clangd -n openkal-image-x86_64 -D image
          mkdir okb
          tar xzf part/clangd-*-openkal.tar.gz -C okb
          echo "OKB=$(cygpath -m "$(ls okb/clangd-*/clangd/bin/clangd.okb)")" >> "$GITHUB_ENV"
      - name: Capture first-chance startup faults
        shell: pwsh
        run: |
          python ci/openkal_windows_startup.py --runner "$env:OKRUN" --cdb "$env:CDB" `
            --raw image/clangd-x86_64.oke --bundle "$env:OKB" --output dist/startup-capture
          if ($LASTEXITCODE -ne 0) { throw "Native diagnostic failed" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openkal-windows-startup-capture
          path: dist/startup-capture
          if-no-files-found: error
