name: release

# The engine's release: the ok image clangd.okb as the payload part
# clangd-<engine>-openkal and where it is accepted (openkal-acceptance.json).
# Native engines are not released (ci/performance-policy.md, "Comparison
# runs"). Tags build and upload; a manual dispatch packages only (dry run).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package artifacts without creating a release"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # the publish job creates the release and uploads assets

jobs:
  eligibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag names the reviewed distribution version
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          version = pathlib.Path('RELEASE_VERSION').read_text().strip()
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version), 'invalid distribution version'
          if os.environ['RELEASE_REF_TYPE'] == 'tag':
              assert os.environ['RELEASE_REF_NAME'] == 'v' + version, 'tag/RELEASE_VERSION mismatch'
          PY
      - name: Reject experimental patches
        run: python3 ci/check_ledger.py --release
      - name: The version names its comparison run (ci/performance-policy.md)
        run: |
          python3 - <<'PY'
          import pathlib, re
          version = pathlib.Path('RELEASE_VERSION').read_text().strip()
          notes = pathlib.Path('CHANGELOG.md').read_text().split('## [' + version + ']', 1)[1].split('\n## [', 1)[0]
          assert re.search(r'Comparison run: https://github\.com/Sunrisepeak/mcppls-clangd/actions/runs/[0-9]+', notes), \
              f'the {version} changelog entry names no comparison run'
          PY

  # The engine's test program, which the acceptance of the image runs (engine-cts.yml).
  cts:
    needs: eligibility
    uses: ./.github/workflows/engine-cts.yml

  # clangd as an ok image: the payload part clangd-<engine>-openkal and where it is accepted.
  openkal:
    needs: [eligibility, cts]
    uses: ./.github/workflows/openkal.yml

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [openkal]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release notes for this version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          version = Path('RELEASE_VERSION').read_text().strip()
          notes = Path('CHANGELOG.md').read_text().split('## [' + version + ']\n', 1)[1].split('\n## [', 1)[0]
          Path('release-notes.md').write_text(notes.strip() + '\n')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: clangd-openkal
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: acceptance-*
          path: acceptance
      - name: Where the ok image is accepted
        run: |
          python3 - <<'PY'
          import glob, json
          reports = [json.load(open(f)) for f in sorted(glob.glob("acceptance/*/acceptance-*.json"))]
          json.dump({r["platform"]: r for r in reports}, open("dist/openkal-acceptance.json", "w"), indent=1)
          for r in reports:
              print(r["platform"], "accepted" if r["accepted"] else "not accepted: " + "; ".join(r["failures"]))
          PY
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/openkal-acceptance.json
          generate_release_notes: true
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
