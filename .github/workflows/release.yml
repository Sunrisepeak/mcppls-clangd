name: release

# Per-platform release artifacts (plan doc §4.3). Tags build and upload the
# payloads; a manual dispatch packages artifacts only (dry run).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package artifacts without creating a release"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-22.04
          - platform: linux-arm64
            os: ubuntu-22.04-arm
          - platform: darwin-arm64
            os: macos-14
          - platform: win32-x64
            os: windows-2022
    name: package ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        shell: bash
        run: |
          set -e
          case "${{ matrix.platform }}" in
            linux-*)  sudo apt-get update && sudo apt-get install -y ninja-build ccache ;;
            darwin-*) brew install ninja ccache ;;
            win32-*)  pip install ninja ;;
          esac
      - name: MSVC environment
        if: matrix.platform == 'win32-x64'
        uses: ilammy/msvc-dev-cmd@v1

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.platform }}-${{ hashFiles('UPSTREAM') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.platform }}-${{ hashFiles('UPSTREAM') }}-
            ccache-${{ matrix.platform }}-
      - uses: actions/cache@v4
        with:
          path: llvm-project
          key: llvm-tree-${{ matrix.platform }}-${{ hashFiles('UPSTREAM') }}
          restore-keys: llvm-tree-${{ matrix.platform }}-

      - name: Build and package
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          JOBS: 4
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          PACKAGE: "1"
        run: ./ci/ci_build.sh

      - name: Archive payload part
        shell: bash
        run: |
          cd dist
          PART=$(find . -maxdepth 1 -type d -name "clangd-*-${{ matrix.platform }}" | head -1)
          tar czf "${PART}.tar.gz" "$PART"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${PART}.tar.gz" > "${PART}.tar.gz.sha256"
          else
            shasum -a 256 "${PART}.tar.gz" > "${PART}.tar.gz.sha256"
          fi
          echo "artifact: ${PART}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: clangd-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
