name: openkal

# clangd as an ok image (mcpp design 2026-10-30 part 2 §25.3): one image per architecture, built by
# openkal/clangd (mcpp links and seals it over llvm-project's libraries, which okgen builds with
# the conventions mcpp's contract states), bundled into one clangd.okb that each system's okrun
# starts, and measured against the native clangd on the four systems. A system where the image
# meets the acceptance (every case, parse time at most 1.3x, resident set at most the image above
# the native one) uses clangd.okb in mcppls's payload; the others keep the native clangd.
#
# Called by build-test (a pull request) and release (a tag): the part it writes,
# clangd-<engine>-openkal.tar.gz, is the payload part of the ok image, and acceptance-*.json says
# where it is accepted.

on:
  workflow_call:
  workflow_dispatch:

env:
  MCPP_VERSION: 2026.10.31.3
  XLINGS_VERSION: v2026.10.26.1
  XLINGS_NON_INTERACTIVE: '1'
  NATIVE_RELEASE: v0.0.17
  NATIVE_ENGINE: 23.1.0-mcppls.5

jobs:
  image:
    name: image ${{ matrix.arch }}-openkal
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    # The build program reads these (build.mcpp, `rerun-if-env-changed`), so every step that plans
    # the image -- the build and the smoke run -- states the same ones.
    env:
      MCPPLS_LLVM_DIR: ${{ github.workspace }}/llvm-project
      MCPPLS_HOST_TOOLS: ${{ github.workspace }}/host-tools/bin
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - name: Room for LLVM
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Tools
        run: sudo bash ci/scripts/apt-install.sh ninja-build ccache cmake
      - name: mcpp
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh | bash -s "$XLINGS_VERSION"
          export PATH="$HOME/.xlings/subos/current/bin:$PATH"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"
          for attempt in 1 2 3 4 5; do
            xlings update > /dev/null 2>&1 || true
            if xlings install "mcpp@$MCPP_VERSION" -y -g; then break; fi
            [ "$attempt" = 5 ] && exit 1
            sleep 30
          done
          mcpp --version
          mcpp self config --mirror GLOBAL
      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: openkal-ccache-${{ matrix.arch }}-${{ hashFiles('UPSTREAM', 'patches/**', 'overlay/**', 'openkal/patches/**') }}-${{ github.run_id }}
          restore-keys: |
            openkal-ccache-${{ matrix.arch }}-${{ hashFiles('UPSTREAM', 'patches/**', 'overlay/**', 'openkal/patches/**') }}-
            openkal-ccache-${{ matrix.arch }}-
      - name: llvm-project with the series and the openkal series
        run: |
          set -euo pipefail
          ./ci/scripts/fetch.sh
          ./ci/scripts/apply.sh --openkal
      - name: The host's tablegen
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          set -euo pipefail
          cmake -G Ninja -S llvm-project/llvm -B host-tools -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang;clang-tools-extra" -DLLVM_TARGETS_TO_BUILD=X86 \
            -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF -DLLVM_ENABLE_ZSTD=OFF -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache > host-tools.log
          ninja -C host-tools -j "$(nproc)" llvm-tblgen llvm-min-tblgen clang-tblgen clang-tidy-confusable-chars-gen >> host-tools.log 2>&1 \
            || { tail -60 host-tools.log; exit 1; }
      - name: The image
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 6G
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          set -euo pipefail
          ccache -z || true
          export JOBS="$(nproc)"
          # The engine's version is the native builds' (FORK_SUFFIX, okgen reads it).
          source ci/scripts/env.sh
          export FORK_SUFFIX
          (cd openkal/clangd && mcpp build --release --target ${{ matrix.arch }}-openkal)
          ccache -s || true
          mkdir -p out
          cp "$(ls openkal/clangd/target/${{ matrix.arch }}-openkal/*/bin/clangd.oke | head -1)" out/clangd-${{ matrix.arch }}.oke
          # clang's own headers, which clangd reads beside it (one copy serves both images).
          # The libraries are a `prepare` action's output, under the build's out
          # directory (`target/.build-mcpp/out/<configuration>/clangd/llvm`), not
          # under the configuration's own directory.
          res="$(find openkal/clangd/target -type d -path '*/llvm/lib/clang' | head -1)"
          [ -n "$res" ] || { echo "::error::no llvm/lib/clang under openkal/clangd/target"; exit 1; }
          cp -R "$res" out/clang
          ls -l out
      - name: Keep ccache, whatever the build did
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}
      - name: Smoke (x86_64 on this machine)
        if: matrix.arch == 'x86_64'
        run: cd openkal/clangd && mcpp run --release --target x86_64-openkal -- --version
      - uses: actions/upload-artifact@v4
        with:
          name: openkal-image-${{ matrix.arch }}
          path: out/

  bundle:
    name: clangd.okb, the payload part
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: openkal-image-*
          path: images
      - name: okld bundle
        run: |
          set -euo pipefail
          source ci/scripts/env.sh
          curl -fsSL --retry 3 https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh | bash -s "$XLINGS_VERSION"
          export PATH="$HOME/.xlings/subos/current/bin:$PATH"
          xlings install "mcpp@$MCPP_VERSION" -y -g
          mkdir -p h/src && (cd h && printf '[package]\nname = "h"\nversion = "0.1.0"\n' > mcpp.toml \
            && printf 'int main() { return 0; }\n' > src/main.cpp && mcpp build --target x86_64-openkal > /dev/null)
          okld="$(ls ~/.mcpp/build-cache/v1/tool/mcpplibs/openkal-tools@*/*/bin/okld | sort -V | tail -1)"
          # okld bundle wants one image name across the architectures.
          mkdir -p x86_64 aarch64
          cp images/openkal-image-x86_64/clangd-x86_64.oke x86_64/clangd.oke
          cp images/openkal-image-aarch64/clangd-aarch64.oke aarch64/clangd.oke
          part="clangd-${FORK_VERSION}-openkal"
          mkdir -p "dist/$part/clangd/bin" "dist/$part/clangd/lib"
          "$okld" bundle "dist/$part/clangd/bin/clangd.okb" --name clangd --version "$FORK_VERSION" --entry clangd x86_64/clangd.oke aarch64/clangd.oke
          "$okld" bundle check "dist/$part/clangd/bin/clangd.okb"
          cp -R images/openkal-image-x86_64/clang "dist/$part/clangd/lib/clang"
          echo "PART=$part" >> "$GITHUB_ENV"
          echo "OKRUN=$(ls ~/.mcpp/build-cache/v1/tool/mcpplibs/openkal-tools@*/*/bin/okrun | sort -V | tail -1)" >> "$GITHUB_ENV"
      - name: llvm-project with the series and the openkal series (the identity's canaries read its tests)
        run: |
          set -euo pipefail
          ./ci/scripts/fetch.sh
          ./ci/scripts/apply.sh --openkal
      # The part a native engine is, for the ok image: the license and notice, and engine.json, the
      # identity mcppls checks (S4-4-10), written after every capability canary passed on
      # clangd.okb as okrun starts it.
      - name: The identity of clangd.okb
        run: |
          set -euo pipefail
          source ci/scripts/env.sh
          cp "$LLVM_DIR/llvm/LICENSE.TXT" "dist/$PART/clangd/LICENSE.TXT"
          cat > "dist/$PART/clangd/NOTICE.txt" <<EOF
          mcppls-clangd is based on LLVM/Clang $UPSTREAM_VERSION.
          Upstream: https://github.com/llvm/llvm-project
          Modifications: https://github.com/Sunrisepeak/mcppls-clangd
          LLVM is distributed under Apache-2.0 WITH LLVM-exception; see LICENSE.TXT.
          Engine source and ordered patch identities are recorded in engine.json.
          This engine is an openkal ok image of x86_64 and aarch64, which okrun starts on Linux, macOS and Windows.
          EOF
          python3 ci/package_identity.py --platform openkal --runner "$OKRUN" --llvm-dir "$LLVM_DIR" \
            --directory "dist/$PART/clangd" --version "$FORK_VERSION" --checksums "dist/$PART"
          cat "dist/$PART/clangd/engine.json"
          cd dist
          tar czf "$PART.tar.gz" "$PART"
          sha256sum "$PART.tar.gz" > "$PART.tar.gz.sha256"
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: clangd-openkal
          path: |
            dist/*.tar.gz
            dist/*.sha256

  accept:
    name: acceptance ${{ matrix.platform }}
    needs: bundle
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, os: ubuntu-24.04, arch: x86_64, std: '' }
          - { platform: linux-arm64, os: ubuntu-24.04-arm, arch: aarch64, std: '' }
          - { platform: darwin-arm64, os: macos-15, arch: aarch64, std: 'mac' }
          - { platform: win32-x64, os: windows-2022, arch: x86_64, std: 'msvc' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install psutil
      - name: MSVC environment
        if: matrix.std == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/download-artifact@v4
        with:
          name: clangd-openkal
          path: part
      - uses: actions/download-artifact@v4
        with:
          name: openkal-image-${{ matrix.arch }}
          path: image
      - name: xlings (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://d2learn.org/xlings-install.ps1.txt | iex
          "$env:USERPROFILE\.xlings\subos\current\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: xlings
        if: runner.os != 'Windows'
        run: |
          curl -fsSL --retry 3 https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh | bash -s "$XLINGS_VERSION"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"
      - name: okrun and the native clangd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if xlings install "mcpp@$MCPP_VERSION" -y -g; then break; fi
            [ "$attempt" = 5 ] && exit 1
            sleep 30
          done
          mkdir -p h/src && (cd h && printf '[package]\nname = "h"\nversion = "0.1.0"\n' > mcpp.toml \
            && printf 'int main() { return 0; }\n' > src/main.cpp && mcpp build --target ${{ matrix.arch }}-openkal > /dev/null)
          okrun="$(ls ~/.mcpp/build-cache/v1/tool/mcpplibs/openkal-tools@*/*/bin/okrun* | sort -V | tail -1)"
          echo "OKRUN=$okrun" >> "$GITHUB_ENV"
          gh release download "$NATIVE_RELEASE" -p "clangd-$NATIVE_ENGINE-${{ matrix.platform }}.tar.gz" -O native.tgz
          mkdir native && tar xzf native.tgz -C native
          echo "NATIVE=$(ls -d native/clangd-*/clangd)/bin/clangd" >> "$GITHUB_ENV"
          mkdir okb && tar xzf part/clangd-*-openkal.tar.gz -C okb
          echo "OKB=$(ls okb/clangd-*/clangd/bin/clangd.okb)" >> "$GITHUB_ENV"
      - name: Arguments of the standard-library case
        run: |
          set -euo pipefail
          args=""
          case "${{ matrix.std }}" in
            mac) args="--target=arm64-apple-macos14 -isysroot $(xcrun --show-sdk-path)" ;;
            msvc)
              args="--target=x86_64-pc-windows-msvc -fms-compatibility -fms-extensions"
              IFS=';' read -ra dirs <<< "$INCLUDE"
              for d in "${dirs[@]}"; do [ -n "$d" ] && args="$args -imsvc$(cygpath -m "$d")"; done ;;
          esac
          echo "STD_ARGS=$args" >> "$GITHUB_ENV"
      - name: Native clangd
        run: python ci/openkal_check.py --label native-${{ matrix.platform }} --out native.json --std --std-args="$STD_ARGS" -- "$NATIVE"
      - name: clangd.okb under okrun
        continue-on-error: true
        run: python ci/openkal_check.py --label image-${{ matrix.platform }} --out image.json --std --std-args="$STD_ARGS" -- "$OKRUN" "$OKB"
      - name: Acceptance
        run: python ci/openkal_accept.py --platform ${{ matrix.platform }} --native native.json --image image.json --image-file image/clangd-${{ matrix.arch }}.oke --out acceptance-${{ matrix.platform }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-${{ matrix.platform }}
          path: '*.json'
