name: verify-series

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-series-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore pinned llvm-project tree
        uses: actions/cache@v4
        with:
          path: llvm-project
          key: llvm-tree-${{ hashFiles('UPSTREAM') }}-${{ hashFiles('patches/**', 'overlay/**', 'ci/scripts/apply.sh') }}

      - name: Fetch pinned source
        run: ./ci/scripts/fetch.sh

      - name: Apply patch series
        run: ./ci/scripts/apply.sh

      - name: Check patch ledger
        run: python3 ci/check_ledger.py

      - name: Release gate negative controls
        run: |
          python3 ci/test_release_gates.py
          python3 ci/test_soak.py

      - name: Summary
        run: |
          {
            echo "### Series verification"
            echo "- UPSTREAM: \`$(awk -F': *' '/^ref:/{print $2}' UPSTREAM)\`"
            echo "- patches: $(grep -c '^[0-9]' patches/series) applied cleanly"
            echo "- ledger: $(python3 ci/check_ledger.py)"
          } >> "$GITHUB_STEP_SUMMARY"
