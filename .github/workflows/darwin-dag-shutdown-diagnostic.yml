name: darwin-dag-shutdown-diagnostic

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: "Immutable darwin-x64-dag-diagnostic-payload artifact ID from build-test"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  diagnostic:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download immutable same-build engine and compiler
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          mkdir -p evidence downloaded
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > evidence/artifact.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('evidence/artifact.json').read_text())
          assert data['name'] == 'darwin-x64-dag-diagnostic-payload' and not data['expired']
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > downloaded/artifact.zip
          python3 - <<'PY'
          import tarfile, zipfile
          from pathlib import Path
          with zipfile.ZipFile('downloaded/artifact.zip') as z:
              assert z.namelist() == ['darwin-dag-payload.tar.gz']
              z.extractall('downloaded')
          with tarfile.open('downloaded/darwin-dag-payload.tar.gz') as t:
              t.extractall('downloaded', filter='data')
          PY
      - name: Replay default and standard-library-disabled control
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=$(python3 -c 'import json; print(json.load(open("evidence/artifact.json"))["workflow_run"]["id"])')
          WORKFLOW_HEAD_SHA=$(python3 -c 'import json; print(json.load(open("evidence/artifact.json"))["workflow_run"]["head_sha"])')
          python3 ci/darwin_dag_diagnostic.py ab --payload downloaded/payload \
            --output evidence/replay --run-id "$RUN_ID" --workflow-head-sha "$WORKFLOW_HEAD_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: darwin-x64-dag-shutdown-diagnostic
          path: evidence/
          if-no-files-found: error
