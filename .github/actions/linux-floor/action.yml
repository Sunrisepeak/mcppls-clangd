name: Linux floor package
description: Build and execute the engine in the pinned Ubuntu 20.04 rootfs.
runs:
  using: composite
  steps:
    - name: Import verified Ubuntu rootfs
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYROOT'
        import json, os
        from pathlib import Path
        pin = json.loads(Path('ci/linux-floor-rootfs.json').read_text())
        with open(os.environ['GITHUB_ENV'], 'a') as out:
            out.write('MCPPLS_ROOTFS_URL=' + pin['url'] + '\n')
            out.write('MCPPLS_ROOTFS_SHA256=' + pin['sha256'] + '\n')
        PYROOT
    - name: Build and validate final Linux package
      shell: bash
      run: |
        set -euo pipefail
        rootfs="$RUNNER_TEMP/mcppls-ubuntu20-root.tar.gz"
        curl -fL --retry 3 --retry-all-errors "$MCPPLS_ROOTFS_URL" -o "$rootfs"
        echo "$MCPPLS_ROOTFS_SHA256  $rootfs" | sha256sum -c -
        docker import "$rootfs" mcppls-linux-floor:20.04
        docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
          -e JOBS=4 -e DIST_DIR="$GITHUB_WORKSPACE/dist" \
          -e CCACHE_DIR="$GITHUB_WORKSPACE/.ccache-floor" \
          mcppls-linux-floor:20.04 bash ci/scripts/linux-floor.sh
        sudo chown -R "$(id -u):$(id -g)" .ccache-floor dist build-linux-x64-ubuntu20
