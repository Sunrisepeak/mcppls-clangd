# clangd as an ok image (`<arch>-openkal`): one ELF program per architecture that each system's
# okrun starts (mcpp design 2026-10-30 part 2 §25.3). Its main is clangd's own; the libraries
# below it are llvm-project's, built by CMake for the target as mcpp's contract states it (okgen,
# run by build.mcpp), and linked and sealed by mcpp.
#
#   MCPPLS_LLVM_DIR=<llvm-project with the series> MCPPLS_HOST_TOOLS=<host tablegen bin> \
#     mcpp build --release --target x86_64-openkal
[package]
name    = "clangd"
version = "23.1.0"
mcpp    = ">=2026.10.31.3"

[targets.clangd]
kind = "bin"
main = "src/main.cpp"

[build]
cxxflags = ["-fno-rtti", "-fno-exceptions"]

[build-dependencies]
okgen = { path = "../okgen", tools = ["okgen"] }

# The platform of the ok images: openkal-platform 0.23.0, openkal 0.23 -- an image at a base of each
# boot, its data a prepared copy of the user's, a snapshot of its initialisers made once a boot and
# mapped by every later start (openkal-image 0.4.0); its RELRO sealed; the code it starts with read in
# by its touch note; frame pointers, a global stack guard, zeroed locals and libc++'s fast hardening;
# a build-id (mcpp design 2026-11-03 part 4).
[target.'cfg(os = "openkal")']
platform = "openkal-platform@0.23.0"
