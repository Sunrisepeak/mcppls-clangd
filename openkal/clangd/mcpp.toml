# clangd as an ok image (`<arch>-openkal`): one ELF program per architecture that each system's
# okrun starts (mcpp design 2026-10-30 part 2 §25.3). Its main is clangd's own; the libraries
# below it are llvm-project's, built by CMake for the target as mcpp's contract states it (okgen,
# run by build.mcpp), and linked and sealed by mcpp.
#
#   MCPPLS_LLVM_DIR=<llvm-project with the series> MCPPLS_HOST_TOOLS=<host tablegen bin> \
#     mcpp build --release --target x86_64-openkal
[package]
name    = "clangd"
version = "23.1.0"
mcpp    = ">=2026.10.31.3"

[targets.clangd]
kind = "bin"
main = "src/main.cpp"

[build]
cxxflags = ["-fno-rtti", "-fno-exceptions"]

[build-dependencies]
okgen = { path = "../okgen", tools = ["okgen"] }

# The platform of the ok images: openkal-platform 0.21.1, openkal 0.21 -- an image's instructions and
# read-only data mapped from its file (openkal-image 0.3.0, kal_exec_map_part), and an okb member whose
# admission was remembered admitted without reading it (0.3.1), so that each module worker starts as a
# native program does; programs started without copying their starter on Linux
# (openkal-linux 0.22.0) and an ended program's processor time; memory over openkal.region, mimalloc
# embedded, an open directory's identity and a normal mutex waited for as the system's library waits
# (openkal-musl 0.26.0); transfers at an offset and a supervised limit on a unit of workers
# (openkal 0.20; mcpp design 2026-11-02 part 3).
[target.'cfg(os = "openkal")']
platform = "openkal-platform@0.21.1"
