# clangd as an ok image (`<arch>-openkal`): one ELF program per architecture that each system's
# okrun starts (mcpp design 2026-10-30 part 2 §25.3). Its main is clangd's own; the libraries
# below it are llvm-project's, built by CMake for the target as mcpp's contract states it (okgen,
# run by build.mcpp), and linked and sealed by mcpp.
#
#   MCPPLS_LLVM_DIR=<llvm-project with the series> MCPPLS_HOST_TOOLS=<host tablegen bin> \
#     mcpp build --release --target x86_64-openkal
[package]
name    = "clangd"
version = "23.1.0"
mcpp    = ">=2026.10.31.3"

[targets.clangd]
kind = "bin"
main = "src/main.cpp"

[build]
cxxflags = ["-fno-rtti", "-fno-exceptions"]

[build-dependencies]
okgen = { path = "../okgen", tools = ["okgen"] }

# The platform of the ok images: openkal-platform 0.20.1, openkal 0.19 -- the C library's file
# `mmap` through `openkal.map`; the host's physical cores and a context's claim on the processors
# (kal_task_cores, kal_task_set_priority), which the openkal series reads for LLVM's thread pools;
# a program's identifier and lock files that the environment answers (openkal-musl 0.24.0); and the
# okrun that releases the image file once loaded and verifies its chunk digests on several contexts
# (openkal-image 0.1.8); on macOS a context's identity, which the C library asks at every thread-local
# access, without a system call (openkal-macos 0.17.1; mcpp design 2026-10-30 part 2 §25.3 B1, §25.9).
[target.'cfg(os = "openkal")']
platform = "openkal-platform@0.20.1"
