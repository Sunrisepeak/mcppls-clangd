# clangd as an ok image (`<arch>-openkal`): one ELF program per architecture that each system's
# okrun starts (mcpp design 2026-10-30 part 2 §25.3). Its main is clangd's own; the libraries
# below it are llvm-project's, built by CMake for the target as mcpp's contract states it (okgen,
# run by build.mcpp), and linked and sealed by mcpp.
#
#   MCPPLS_LLVM_DIR=<llvm-project with the series> MCPPLS_HOST_TOOLS=<host tablegen bin> \
#     mcpp build --release --target x86_64-openkal
[package]
name    = "clangd"
version = "23.1.0"
mcpp    = ">=2026.10.31.3"

[targets.clangd]
kind = "bin"
main = "src/main.cpp"

[build]
cxxflags = ["-fno-rtti", "-fno-exceptions"]

[build-dependencies]
okgen = { path = "../okgen", tools = ["okgen"] }

# zlib, which the engine's index shards and compressed debug sections use: llvm-project is configured
# with its headers (okgen, LLVM_ENABLE_ZLIB=FORCE_ON) and the image links the library this
# dependency builds for the target. A native clangd links zlib too, so the shards either engine
# writes the other reads (mcpp design 2026-11-07, §4.5 item 4).
[target.'cfg(os = "openkal")'.dependencies.compat]
zlib = "1.3.2"

# The platform of the ok images, stated here only: ci/scripts/probe-platform.sh writes every probe
# of CI from this line. openkal-platform 0.24.3, openkal 0.24 -- an image at a base of each boot,
# its data a prepared copy of the user's; a background worker can snapshot eligible initialisers
# and later starts can map the completed snapshot (openkal-image 0.5); its RELRO sealed; its first
# code read in by its touch note; frame pointers, a global stack guard, zeroed locals and libc++'s
# fast hardening; a build-id (mcpp design 2026-11-03 part 4). The exact version is the images'
# qualification identity (mcpp design 2026-11-07, A4).
[target.'cfg(os = "openkal")']
platform = "openkal-platform@0.24.3"
