# The engine's conformance cases (README.md): one program, `engine-cts`, whose cases are the
# regressions of the series, each a session of the engine over a project the case writes
# (harness.cppm). It is a conformance suite run against a subject -- the engine the
# environment names, a native build or the ok image under its runner -- which may lack what a
# case needs (mcpplibs.mtest.cts). It speaks the mtest protocol, so mtest lists, selects,
# schedules and records the cases; alone it runs them one after another.
#
# Built once as an ok image and run on every system by that system's runner:
#
#   mcpp build --release --target x86_64-openkal        # target/x86_64-openkal/<id>/bin/engine-cts.oke
#   MCPPLS_ENGINE=<clangd.okb> MCPPLS_ENGINE_RUNNER=<okrun> MCPPLS_ENGINE_CLANG=<clang> \
#       mtest run --isolate --jobs 2 <engine-cts.oke>
[package]
name        = "engine-cts"
version     = "0.1.0"
description = "The regressions of mcppls-clangd as conformance cases"
license     = "Apache-2.0"
mcpp        = ">=2026.11.9.1"

[language]
standard   = "c++23"
modules    = true
import_std = true

[toolchain]
default = "llvm@23.1.3"

# The platform of the engine's own image (openkal/clangd/mcpp.toml): one runner starts both.
[target.'cfg(any(linux, macos, windows, os = "openkal"))']
platform = "openkal-platform@0.24.4"

[build]
sources = ["*.cppm", "*.cpp"]

[targets.engine-cts]
kind = "bin"
main = "main.cpp"

[dependencies]
mcpplibs.mtest = "0.6.3"
mcpplibs.os    = "0.4.1"
nlohmann.json  = "3.12.0"
